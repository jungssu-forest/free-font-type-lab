<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FREE FONT _ TYPE LAB · 미술과 2학년 온라인 폰트 전시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Jua&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  ▼ 학생 작품 넣는 법 (스크립트 맨 위 WORKS / FONT_FILES 만 고치면 됩니다)
  폴더 구조
    index.html   ← 전시 사이트 (이 파일)
    fonts/       ← 학생 폰트 파일 (.ttf / .otf)
    works/       ← 학생 인터랙티브 페이지 (.html)
  작품을 고치거나 추가할 때는 스크립트의 WORKS 와 FONT_FILES 를 수정합니다.
  * 영문 전용 폰트는 sample / tester 에 영문을 넣어 주세요. (한글은 기본 글꼴로 보여요)
-->
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --fg:#fff;
  --lav:#C7B3FF;
  --lav-2:#E3D9FF;
  --lav-3:#9C82F0;
  --ink:#0A0812;
  --cream:#F6F0E6;
  --line:rgba(255,255,255,.88);
  --faint:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.05);
  --display:"Dela Gothic One","Black Han Sans",system-ui,sans-serif;
  --round:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; --fg:#fff; } }
:root[data-theme="dark"]{ --bg:#000; --fg:#fff; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:3px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,36px)}
.sr{position:absolute;left:-9999px}

/* ── header ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--faint)}
.logo{font-family:var(--display);font-size:clamp(15px,1.6vw,19px);transform:skewX(-12deg);display:inline-block;white-space:nowrap}
.nav{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:5px 14px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1.5px solid transparent}
.nav a:hover{border-color:var(--faint)}
.nav a.on{background:var(--lav);color:var(--ink)}
.nav a.about{border-color:var(--line)}
.nav a.about.on{border-color:var(--lav)}
.help{width:36px;height:36px;display:grid;place-items:center;flex:none;margin-left:6px}
.help svg{width:30px;height:30px}

/* ── hero ── */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:center;padding:30px 0 50px;position:relative}
.hero-l{position:relative;text-align:center;padding:30px 0 10px}
.big{position:relative;font-family:var(--display);font-size:clamp(70px,10.5vw,158px);line-height:.82;margin:0;transform:skewX(-14deg) rotate(-4deg);letter-spacing:-.02em;font-weight:400}
.big span{display:block}
.big span:first-child{margin-right:.7em}
.big span+span{margin-left:.6em}
.title-wrap{position:relative;display:block;width:fit-content;margin:0 auto;padding:2% 4%}
.orbit{position:absolute;left:-6%;right:-6%;top:12%;bottom:8%;width:112%;height:80%;pointer-events:none;overflow:visible}
.badge,.hero-sub,.cta,.hero-cursor{position:relative;z-index:2}
.spark{position:absolute;color:var(--lav);pointer-events:none}
.badge{position:relative;display:inline-flex;align-items:center;gap:14px;margin-top:22px;padding:8px 34px;font-family:var(--display);font-size:clamp(24px,2.8vw,38px);letter-spacing:.04em}
.badge::before,.btn-pixel::before{content:"";position:absolute;inset:0;border:3.5px solid var(--fg);clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px)}
.badge svg{width:.9em;height:.9em}
.hero-sub{margin:16px 0 26px;font-size:clamp(16px,1.5vw,20px)}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--lav);color:var(--ink);border-radius:999px;padding:14px 40px;font-weight:700;font-size:20px;box-shadow:0 0 34px rgba(199,179,255,.45)}
.cta:hover{background:var(--lav-2)}
.hero-cursor{width:40px;vertical-align:middle;margin-left:18px}
.hero-r{position:relative}
.flask{width:100%;max-width:500px;height:auto;display:block;margin:0 auto;mix-blend-mode:screen;animation:bob 7s ease-in-out infinite}
.stamp{position:absolute;right:2%;top:4%;border:1.5px solid var(--line);padding:8px 14px;font-size:13px;line-height:1.45;letter-spacing:.08em;transform:rotate(-6deg);background:rgba(0,0,0,.4)}

/* ── poster hero ── */
.poster{position:relative;margin:26px 0 10px;border:1.5px solid rgba(199,179,255,.55);border-radius:6px;padding:clamp(14px,2vw,26px);background:radial-gradient(ellipse at 50% 45%,rgba(120,90,255,.18),transparent 60%),#05040a;overflow:hidden}
.poster::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.2px);background-size:3px 3px;opacity:.12}
.p-top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}
.p-list{list-style:none;margin:0;padding:0;font-family:var(--display);font-size:clamp(11px,1vw,13px);letter-spacing:.06em;line-height:1.5;color:var(--lav-2);text-transform:uppercase}
.p-list.r{text-align:right}
.p-list a:hover{color:#fff}
.p-mark{font-family:var(--display);font-size:clamp(20px,2.2vw,30px);letter-spacing:.06em;text-align:center;color:#fff;transform:skewX(-10deg);line-height:1}
.p-mark small{display:block;transform:skewX(10deg);font-family:var(--body);font-size:11px;letter-spacing:.04em;color:#bdb3dc;margin-top:6px}
.p-title{position:relative;z-index:2;margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,120px);line-height:.9;letter-spacing:.02em;color:#fbf8ff;text-shadow:0 0 .06em #fff,0 0 .25em rgba(199,179,255,.8);transition:opacity .6s}
.p-stage{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:clamp(10px,2vw,26px);align-items:stretch}
.p-side{writing-mode:vertical-rl;font-family:var(--display);font-size:clamp(36px,5.6vw,82px);line-height:1;letter-spacing:.08em;color:transparent;-webkit-text-stroke:1.5px rgba(199,179,255,.75);text-align:center;user-select:none}
.p-side.l{transform:rotate(180deg)}
.p-box{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;color:rgba(199,179,255,.45);background:radial-gradient(ellipse at 50% 50%,rgba(140,90,255,.22),transparent 60%),#05040a}
.p-grid{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform}
.p-bokeh{position:absolute;inset:-8%;background-image:radial-gradient(circle,rgba(176,125,255,.95) 0 5px,transparent 7px),radial-gradient(circle,rgba(120,70,240,.75) 0 3px,transparent 5px);background-size:38px 38px,25px 25px;background-position:0 0,12px 9px;filter:blur(2.6px);-webkit-mask-image:radial-gradient(ellipse at center,transparent 0%,transparent 42%,rgba(0,0,0,.6) 62%,#000 82%);mask-image:radial-gradient(ellipse at center,transparent 0%,transparent 42%,rgba(0,0,0,.6) 62%,#000 82%);animation:drift 22s linear infinite;opacity:.8}
.p-box::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
@keyframes drift{to{background-position:38px 38px,37px 34px}}
.p-hud{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;opacity:0;transition:opacity .6s}
.p-box.live .p-hud{opacity:1}
.p-bar{display:block;width:min(220px,46%);min-width:150px;height:9px;border:1.5px solid rgba(227,217,255,.8);border-radius:999px;padding:1.5px}
.p-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#fff,#c7b3ff)}
.p-deg{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:rgba(227,217,255,.75)}
.p-3d{position:absolute;inset:0;z-index:2;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s;cursor:grab;touch-action:pan-y}
.p-3d.on{opacity:1}
.p-3d.drag{cursor:grabbing}
.p-box.live .p-title{opacity:0}
.p-hint{position:absolute;right:12px;bottom:10px;font-family:var(--display);font-size:11px;letter-spacing:.12em;color:rgba(227,217,255,.7);opacity:0;transition:opacity .6s;pointer-events:none}
.p-box.live .p-hint{opacity:1}
.p-panel{position:relative;margin-top:clamp(16px,2vw,24px);display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:clamp(14px,2vw,28px);background:var(--lav-2);color:var(--ink);border-radius:4px;padding:clamp(16px,2vw,24px)}
.pp-sub{margin:0 0 16px;font-weight:700;font-size:clamp(17px,1.6vw,21px);line-height:1.35}
.cta.dark{background:var(--ink);color:#fff;box-shadow:0 0 0 0 transparent;font-size:18px;padding:13px 30px}
.cta.dark:hover{background:#2a2140}
.pp-list{border-left:1.5px solid rgba(10,8,18,.25);border-right:1.5px solid rgba(10,8,18,.25);padding:0 clamp(12px,2vw,26px)}
.pp-list h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:clamp(13px,1.2vw,16px);letter-spacing:.06em}
.pp-list ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.pp-list a{display:flex;gap:10px;align-items:baseline}
.pp-list a:hover{text-decoration:underline}
.pp-list b{font-family:var(--display);font-weight:400}
.pp-list span{margin-left:auto;color:#5b5470;font-size:13px}
.pp-big{margin:0;font-family:var(--display);font-size:clamp(15px,1.4vw,19px);line-height:1.1;letter-spacing:.06em}
.pp-note{margin:10px 0;font-size:13px;line-height:1.5;color:#3d3650}
.pp-tags{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.pp-tags span{border:1.5px solid var(--ink);border-radius:999px;padding:2px 12px;font-family:var(--display);font-size:11px;letter-spacing:.08em}
@media (max-width:860px){
  .p-side{display:none}
  .p-stage{grid-template-columns:1fr}
  .p-box{aspect-ratio:1/1}
  .p-panel{grid-template-columns:1fr}
  .pp-list{border:0;border-top:1.5px solid rgba(10,8,18,.25);border-bottom:1.5px solid rgba(10,8,18,.25);padding:14px 0}
}
@media (max-width:560px){
  .p-top{grid-template-columns:1fr 1fr}
  .p-mark{grid-column:1/-1;grid-row:1}
  .p-list{font-size:10px}
}

.rv{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1),filter .7s ease;transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none;filter:none}}

.marquee{position:relative;margin:34px calc(50% - 50vw) 10px;padding:14px 0;overflow:hidden;border-top:1.5px solid rgba(199,179,255,.35);border-bottom:1.5px solid rgba(199,179,255,.35);background:linear-gradient(90deg,#000,rgba(120,90,255,.12),#000)}
.mq-track{display:flex;align-items:center;gap:clamp(22px,3vw,44px);width:max-content;white-space:nowrap;will-change:transform}
.mq-track+.mq-track{margin-top:6px}
.mq-w{font-size:clamp(34px,5.4vw,78px);line-height:1.15;color:#fbf8ff;text-shadow:0 0 .12em rgba(199,179,255,.7)}
.mq-track.rev .mq-w{color:transparent;-webkit-text-stroke:1.2px rgba(199,179,255,.85);text-shadow:none}
.mq-s{color:var(--lav);font-size:clamp(18px,2vw,28px)}

html,body{overflow-x:clip}
#app.scan-in{animation:scanReveal .55s cubic-bezier(.6,.05,.3,1) both}
@keyframes scanReveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 calc(100% - 100vh) 0)}}
.pg-scan{position:fixed;inset:0;pointer-events:none;z-index:300;opacity:0}
.pg-scan.run{animation:scanFade .62s linear}
.pg-scan i{position:absolute;left:0;right:0;top:0;height:2px;background:#fff;box-shadow:0 0 10px 2px #c7b3ff,0 0 44px 10px rgba(150,110,255,.55)}
.pg-scan i::before{content:"";position:absolute;left:0;right:0;bottom:2px;height:90px;background:linear-gradient(0deg,rgba(199,179,255,.32),transparent)}
.pg-scan.run i{animation:scanMove .55s cubic-bezier(.6,.05,.3,1) both}
@keyframes scanMove{from{transform:translateY(-2px)}to{transform:translateY(100vh)}}
@keyframes scanFade{0%,82%{opacity:1}100%{opacity:0}}

/* ── lab record panel ── */
.p-panel.lab{display:block;background:rgba(10,8,20,.88);color:var(--fg);border:1px solid rgba(199,179,255,.45);border-radius:2px;padding:0;position:relative;font-family:"IBM Plex Mono",ui-monospace,monospace}
.p-panel.lab::before,.p-panel.lab::after{content:"+";position:absolute;color:var(--lav);font-size:16px;line-height:1}
.p-panel.lab::before{left:-6px;top:-9px}.p-panel.lab::after{right:-6px;bottom:-9px}
.lab-bar{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-bottom:1px solid rgba(199,179,255,.3);font-size:11px;letter-spacing:.14em;color:#bdb3dc}
.lab-bar span{display:inline-flex;align-items:center;gap:8px}
.lab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lav);box-shadow:0 0 8px var(--lav);animation:labBlink 1.6s steps(2,start) infinite}
@keyframes labBlink{to{opacity:.25}}
.lab-grid{display:grid;grid-template-columns:1.1fr 1.4fr .8fr}
.lab-cell{padding:18px 20px 20px;border-right:1px solid rgba(199,179,255,.22)}
.lab-cell:last-child{border-right:0}
.lab-k{margin:0 0 12px;font-size:11px;letter-spacing:.16em;color:var(--lav)}
.lab-k span{color:#8f86ad;margin-left:6px}
.lab-title{margin:0 0 10px;font-family:var(--body);font-weight:700;font-size:clamp(18px,1.7vw,22px);line-height:1.35;color:#fff}
.lab-note{margin:0 0 18px;font-family:var(--body);font-size:13px;line-height:1.6;color:#bdb3dc}
.lab-cta{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--lav);color:#fff;padding:10px 18px;font-family:var(--body);font-weight:700;font-size:15px;background:linear-gradient(90deg,rgba(199,179,255,.18),transparent);transition:background .2s,color .2s}
.lab-cta:hover{background:var(--lav);color:var(--ink)}
.lab-list{list-style:none;margin:0;padding:0}
.lab-list li+li{border-top:1px dashed rgba(199,179,255,.2)}
.lab-list a{display:flex;align-items:baseline;gap:12px;padding:9px 0;font-size:13px}
.lab-list b{color:var(--lav);font-weight:500;font-size:12px;letter-spacing:.06em}
.lab-list .nm{font-family:var(--body);font-size:15px;color:#fff}
.lab-list .lead{flex:1;border-bottom:1px dotted rgba(199,179,255,.35);transform:translateY(-4px)}
.lab-list .au{font-family:var(--body);color:#bdb3dc;font-size:13px}
.lab-list a:hover .nm{color:var(--lav)}
.lab-read{margin:0 0 18px;display:grid;gap:8px}
.lab-read div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(199,179,255,.18);padding-bottom:6px}
.lab-read dt{font-size:11px;letter-spacing:.14em;color:#8f86ad}
.lab-read dd{margin:0;font-size:22px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.lab-status{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;letter-spacing:.14em;color:#fff}
@media (max-width:860px){
  .lab-grid{grid-template-columns:1fr}
  .lab-cell{border-right:0;border-bottom:1px solid rgba(199,179,255,.22)}
  .lab-cell:last-child{border-bottom:0}
  .lab-read{grid-template-columns:repeat(3,1fr);gap:12px}
  .lab-read div{flex-direction:column;gap:4px}
  .lab-hide{display:none!important}
}


/* ── section heads ── */
.page{padding:30px 0 70px}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 26px}
.head svg.hi{width:44px;height:44px;flex:none}
.head h2{margin:0;font-size:clamp(28px,3vw,38px);font-weight:700;letter-spacing:.01em;line-height:1}
.head h2.it{font-style:italic}
.head p{margin:0;color:#d6d2e4}
.head .push{margin-left:auto}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:5px 26px;font-size:16px}
.chip[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:var(--ink);font-weight:600}
.sel{background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font:inherit;font-size:15px;margin-left:auto}
.empty{padding:50px 20px;text-align:center;color:#ccc;border:1.5px dashed var(--faint);border-radius:12px}

/* ── art (sample renderings) ── */
.art{position:relative;container-type:inline-size;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center}
.glyph{position:relative;z-index:2;font-size:calc(80cqw / var(--n,3));line-height:1;white-space:nowrap;letter-spacing:-.04em}
.art-puffy{background:var(--ink);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:9cqw 9cqw}
.art-puffy .glyph{font-family:var(--round);color:#fff}
.art-mongle{background:var(--cream)}
.art-mongle .glyph{font-family:"Black Han Sans",var(--round);color:#000}
.art-pixel{background:#e9e9e9;background-image:radial-gradient(#9b9b9b 1px,transparent 1.3px);background-size:6px 6px}
.art-pixel canvas,.spec canvas{position:relative;z-index:2;width:84%;image-rendering:pixelated;image-rendering:crisp-edges}
.art-glass{background:radial-gradient(circle at 30% 20%,#c8c8c8,#6b6b6b 55%,#3b3b3b)}
.glass-t{font-family:var(--round);color:transparent;background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,255,255,.25) 45%,rgba(255,255,255,.75) 70%,rgba(255,255,255,.2));-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.012em rgba(255,255,255,.95);filter:drop-shadow(0 .03em .04em rgba(0,0,0,.45))}
.art-custom .glyph{font-size:calc(70cqw / var(--n,3) * var(--s,1))}
.glow-bg{background-image:radial-gradient(ellipse at 50% 55%,rgba(150,120,255,.32),transparent 62%),linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px)!important;background-size:auto,9cqw 9cqw,9cqw 9cqw!important}
.glow-t{text-shadow:0 0 .03em #fff,0 0 .12em rgba(199,179,255,.9),0 0 .35em rgba(120,90,255,.55)}
.torch-bg{background-image:radial-gradient(ellipse at 50% 52%,rgba(255,196,96,.32),transparent 62%)!important}
.torch-t{text-shadow:0 0 .04em #fff4cf,0 0 .18em rgba(255,196,90,.8),0 0 .5em rgba(255,150,40,.45)}
.puff-s{filter:url(#puff-s)}
.puff-l{filter:url(#puff-l)}
.deco{position:absolute;pointer-events:none}
.sq{position:absolute;width:3.2cqw;height:3.2cqw;background:#111}
.ring{position:absolute;border-radius:50%;border:1.6cqw solid rgba(255,255,255,.45);box-shadow:inset 0 0 2cqw rgba(255,255,255,.6),0 0 2cqw rgba(0,0,0,.25)}

/* ── EXP cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:var(--lav-2);color:var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;padding:0 8px 8px;box-shadow:0 0 0 1px rgba(199,179,255,.4),0 0 30px rgba(199,179,255,.12);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.chrome{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;font-weight:700;font-size:14px;letter-spacing:.03em}
.chrome i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);margin-left:4px}
.card .art{border-radius:8px}
.card-meta{display:flex;flex-direction:column;align-items:stretch;padding:12px 6px 4px;gap:10px;flex:1}
.card-meta > div{min-width:0}
.card-meta .go{margin-top:auto}
.card-meta h3{margin:0;font-size:19px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta small{display:block;font-size:15px;color:#544e66}
.stretch{position:absolute;inset:0;z-index:3}

/* ── site button (주목용) ── */
.go{position:relative;z-index:4;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px 8px 18px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;animation:ping 2.4s ease-out infinite}
.go:hover{background:#2a2140}
.go .ar{display:inline-block;animation:nudge 1.2s ease-in-out infinite}
.go::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(199,179,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
.btn-go{position:relative;display:inline-flex;align-items:center;gap:12px;background:var(--lav);color:var(--ink);border-radius:999px;padding:16px 36px 16px 40px;font-weight:700;font-size:20px;overflow:hidden;animation:ping-l 2.2s ease-out infinite}
.btn-go:hover{background:#d8caff}
.btn-go .ar{display:inline-block;font-size:22px;animation:nudge 1.1s ease-in-out infinite}
.btn-go::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
.btn-go small{display:block;font-size:13px;font-weight:500;opacity:.75}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(42,20,90,.55)}70%,100%{box-shadow:0 0 0 10px rgba(42,20,90,0)}}
@keyframes ping-l{0%{box-shadow:0 0 0 0 rgba(199,179,255,.75),0 0 30px rgba(199,179,255,.35)}70%,100%{box-shadow:0 0 0 18px rgba(199,179,255,0),0 0 30px rgba(199,179,255,.35)}}
.grid > :nth-child(2) .go,.grid > :nth-child(2) .go::before{animation-delay:.6s}
.grid > :nth-child(3) .go,.grid > :nth-child(3) .go::before{animation-delay:1.2s}
.grid > :nth-child(4) .go,.grid > :nth-child(4) .go::before{animation-delay:1.8s}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:14px 28px;font-weight:600;font-size:17px;border:1.5px solid var(--line)}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:8px 18px;font-size:15px}
.dl-pair{display:inline-flex;align-items:center;gap:8px;color:#ccc;font-size:14px}

/* ── detail ── */
.back{display:inline-flex;gap:8px;align-items:center;color:#ddd;margin:0 0 18px}
.back:hover{color:var(--lav)}
.detail{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:34px;align-items:start}
.frame{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--ink)}
.frame-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:#bbb;border-bottom:1px solid var(--faint)}
.frame-bar i{width:9px;height:9px;border-radius:50%;border:1.3px solid #bbb;display:inline-block}
.frame-bar i:first-of-type{margin-left:auto}
.preview-link{position:relative;display:block}
.hover-tip{position:absolute;inset:auto 0 0 0;z-index:5;display:flex;justify-content:center;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-weight:700;opacity:0;transition:opacity .2s}
.preview-link:hover .hover-tip,.preview-link:focus-visible .hover-tip{opacity:1}
@media (hover:none){.hover-tip{opacity:1}}
.dots{display:flex;justify-content:center;gap:12px;margin-top:16px;align-items:center}
.dots a{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--fg)}
.dots a.on{background:var(--fg)}
.dots .nx{width:auto;height:auto;border:0;font-size:20px;padding:0 6px}
.d-info h1{font-size:clamp(28px,3vw,38px);margin:0;font-weight:700;line-height:1.2}
.d-info h1 em{font-style:normal;color:var(--lav);margin-right:14px}
.d-info .who{color:#ccc;font-size:18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{border:1.5px solid var(--line);border-radius:999px;padding:2px 14px;font-size:13px;font-weight:600}
.d-info p{margin:20px 0 0;color:#ddd}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;align-items:center}
.tester{margin-top:30px;border:1.5px solid var(--faint);border-radius:12px;padding:16px 18px}
.tester-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:#ccc}
.tester input[type=text]{flex:1;min-width:160px;background:transparent;border:0;border-bottom:1.5px solid var(--faint);color:var(--fg);font:inherit;font-size:15px;padding:6px 0}
.tester input[type=range]{accent-color:var(--lav)}
.tester.wide{margin-top:40px;padding:22px 26px}
.tester.wide .tester-row input[type=text]{font-size:17px}
.tester-out{margin-top:12px;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.report{position:relative;margin-top:6px;border:1.5px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(199,179,255,.12),rgba(255,255,255,.02));padding:18px 18px 10px}
.report h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:12px;font-size:16px;letter-spacing:.02em;border-bottom:1.5px solid rgba(199,179,255,.35)}
.report h3 svg{width:20px;height:20px;color:var(--lav)}
.report dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:14px}
.report dt{color:#cfc8e6}
.report dd{margin:0;font-weight:600}
.report dl > *{padding-bottom:10px;border-bottom:1px solid var(--faint)}
.report dl > *:nth-last-child(-n+2){border-bottom:0}

/* ── archive jars ── */
.search{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;gap:8px;min-width:260px}
.search input{flex:1;background:transparent;border:0;color:var(--fg);font:inherit;font-size:15px;min-width:0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--lav)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;position:relative;padding:10px 0 0}
.jar-item{position:relative;display:flex;flex-direction:column;align-items:center}
.jar{position:relative;display:block;width:min(100%,250px);transition:transform .25s}
.jar:hover{transform:translateY(-6px)}
.jar .liq{position:absolute;left:19%;right:15%;bottom:12.5%;height:0;border-radius:0 0 10px 10px;background:linear-gradient(180deg,rgba(214,198,255,.95),rgba(150,110,255,.75) 35%,rgba(96,60,220,.8));box-shadow:0 0 28px rgba(160,120,255,.55),inset 0 6px 14px rgba(255,255,255,.35);transition:height .95s cubic-bezier(.5,.05,.25,1);overflow:visible;pointer-events:none}
.jar .liq::before{content:"";position:absolute;left:0;right:0;top:-7px;height:14px;border-radius:50%;background:rgba(232,222,255,.9);box-shadow:0 0 14px rgba(232,222,255,.8);opacity:0;transition:opacity .2s}
.jar .liq::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 62% 40%,rgba(255,255,255,.6) 0 2.5px,transparent 3.5px),radial-gradient(circle at 45% 85%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px);animation:bub 1s linear infinite}
@keyframes bub{to{transform:translateY(-14px);opacity:.3}}
.jar.filling .liq{height:70%}
.jar.filling .liq::before{opacity:1}
.jar.filling .in{z-index:2}
.jar img{display:block;position:relative;z-index:1;width:100%;height:auto;mix-blend-mode:screen}
.jar:hover img{filter:brightness(1.15)}
.jar .in{position:absolute;left:13%;right:27%;top:30%;bottom:22%;display:grid;place-items:center;container-type:inline-size}
.spec{font-size:calc(92cqw / var(--n,3) * var(--s,1));line-height:1;white-space:nowrap;letter-spacing:-.04em;color:#fff;display:grid;place-items:center;width:100%}
.jar-label{margin-top:4px;text-align:center;font-weight:700;line-height:1.35;letter-spacing:.03em}
.jar-label small{display:block;font-weight:500;font-size:14px;color:#d6d2e4;letter-spacing:0}
.jar-item .go{background:var(--lav);color:var(--ink);animation-name:ping-l}
.jar-item .go{margin-top:14px}
.jar-item .go:hover{background:var(--lav-2)}
.jar-item .go::before{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%)}
.shelf > :nth-child(2) .go,.shelf > :nth-child(2) .go::before{animation-delay:.6s}
.shelf > :nth-child(3) .go,.shelf > :nth-child(3) .go::before{animation-delay:1.2s}
.shelf > :nth-child(4) .go,.shelf > :nth-child(4) .go::before{animation-delay:1.8s}

/* ── process ── */
.steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.step{background:var(--lav-2);color:var(--ink);border-radius:999px;padding:10px 32px;text-align:center;line-height:1.3;box-shadow:0 0 24px rgba(199,179,255,.3)}
.step b{display:block;font-size:17px}
.step small{font-size:13px;color:#544e66}
.step-arr{font-size:22px}
.ptabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border-radius:12px;padding:6px;color:#000}
.strip > div{position:relative;aspect-ratio:1.25;display:grid;place-items:center;container-type:inline-size;border-radius:8px;overflow:hidden;background:#fafafa;background-image:linear-gradient(#e6e6e6 1px,transparent 1px),linear-gradient(90deg,#e6e6e6 1px,transparent 1px);background-size:10cqw 10cqw}
.strip span{font-family:var(--pf,var(--round));font-size:56cqw;line-height:1}
.strip .s1{color:transparent;-webkit-text-stroke:.5cqw #777}
.strip .s2{color:transparent;-webkit-text-stroke:1.1cqw #222}
.strip .s3{color:#111}
.strip .d4{background:#1b1826;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)}
.strip .s4{color:transparent;-webkit-text-stroke:.6cqw var(--lav)}
.strip .node{position:absolute;width:2.6cqw;height:2.6cqw;border:.5cqw solid #fff;background:var(--lav-3)}
.strip-cap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:13px;color:#ccc;margin-top:8px}
.chat-head{margin-top:34px}
.chat-head h3{margin:0 0 4px;font-size:20px}
.chat-head p{margin:0;color:#bdb6d4;font-size:14px}
.chat{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:0;max-width:900px}
.turn{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:22px}
.turn::before{content:"";position:absolute;left:21px;top:40px;bottom:0;width:1.5px;background:linear-gradient(var(--lav),transparent)}
.turn:last-child::before{display:none}
.turn .no{width:42px;height:42px;border-radius:50%;background:var(--lav);color:var(--ink);font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:0 0 18px rgba(199,179,255,.45)}
.q,.a{line-height:1.55}
.q small,.a small{display:block;font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:2px;opacity:.7}
.q{background:var(--lav-2);color:var(--ink);border-radius:4px 18px 18px 18px;padding:10px 18px 12px;font-weight:500;width:fit-content;max-width:100%}
.a{margin-top:8px;border:1.5px solid rgba(199,179,255,.35);background:rgba(199,179,255,.06);border-radius:18px 4px 18px 18px;padding:10px 18px 12px;color:#e6e2f2;width:fit-content;max-width:100%;margin-left:clamp(0px,6vw,60px)}
.log-go{margin-top:6px}
.log-go .go{background:var(--lav);color:var(--ink);animation-name:ping-l}
.log-go .go::before{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%)}

/* ── download ── */
.dl{display:grid;grid-template-columns:1fr 220px;gap:40px;align-items:center}
.table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px}
@media (max-width:640px){
  .dl{grid-template-columns:1fr!important}
  .dl table,.dl tbody,.dl tr,.dl td{display:block;width:auto;min-width:0!important}
  .dl .table-wrap{overflow:hidden}
  .dl thead{display:none}
  .dl tbody tr{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:4px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--faint)}
  .dl tbody tr:last-child{border-bottom:0}
  .dl td{padding:0!important;border:0!important;text-align:left}
  .dl td.n{grid-row:1 / span 2;font-size:22px}
  .dl td:nth-child(3){grid-column:2;color:#bdb3dc;font-size:14px}
  .dl td:nth-child(4){display:none}
  .dl td:last-child{grid-column:1 / -1;margin-top:10px}
  .dl td:last-child>span{display:flex!important;gap:8px}
  .dl .mini{flex:1;min-width:0;justify-content:center;padding:10px 0;font-size:15px}
}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:13px 18px;text-align:left;border-bottom:1px solid var(--faint)}
th{font-weight:600;font-size:14px;background:var(--lav-2);color:var(--ink)}
tr:last-child td{border-bottom:0}
td.n{font-weight:700}
td a.nm:hover{color:var(--lav)}
.mini{display:inline-flex;align-items:center;gap:6px;background:var(--lav);color:var(--ink);border-radius:6px;padding:4px 16px;font-weight:600;font-size:14px}
.files{width:100%;max-width:240px;height:auto;margin:auto;display:block;mix-blend-mode:screen}

/* ── about ── */
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
.about h3{font-size:clamp(24px,2.6vw,32px);margin:0 0 14px;font-weight:700}
.about h3 span{color:var(--lav)}
.about p{color:#ddd;max-width:34em;margin:0}
.crew{margin-top:30px;border:1.5px solid var(--line);border-radius:14px;padding:16px 20px 20px}
.crew h4{margin:0 0 12px;font-size:17px}
.members{display:flex;gap:12px;flex-wrap:wrap}
.member{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:7px 24px 7px 16px;font-size:16px}
.member:hover{background:rgba(199,179,255,.15)}
.member svg{width:20px}
.sculpt{width:100%;max-width:440px;height:auto;justify-self:center;mix-blend-mode:screen;animation:bob 8s ease-in-out infinite}

/* dialog + toast */
dialog{background:var(--ink);color:var(--fg);border:1.5px solid var(--lav);border-radius:14px;max-width:440px;width:calc(100% - 32px);padding:26px 28px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 12px;font-size:20px}
dialog ol{margin:0 0 20px;padding-left:20px;color:#ddd}
dialog .btn{background:var(--lav);color:var(--ink);border-color:var(--lav)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--lav);color:var(--ink);padding:10px 22px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ── responsive ── */
@media (max-width:1100px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .detail{grid-template-columns:1fr 1fr}
  .report{grid-column:1/-1;max-width:520px}
}
@media (max-width:860px){
  .nav{flex-wrap:wrap;justify-content:flex-end;overflow:visible;gap:6px}
  .hero{grid-template-columns:1fr}
  .flask{max-width:320px}
  .stamp{right:6%}
  .detail,.dl,.about{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(2,1fr);row-gap:30px}
  .shelf::after{display:none}
  .files{display:none}
  .head .push{margin-left:0;width:100%}
  .search{min-width:0}
}
@media (max-width:560px){
  .top{flex-direction:column;align-items:flex-start;gap:10px}
  .nav{width:100%;flex-wrap:wrap;overflow:visible;gap:6px;justify-content:flex-start}
  .nav a{padding:4px 11px;font-size:13px}
  .help{margin-left:auto}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:0 6px 6px}
  .card-meta{flex-direction:column;align-items:stretch;padding:8px 2px 2px}
  .card-meta h3{font-size:15px}
  .card-meta small{font-size:13px}
  .go{font-size:13px;padding:7px 10px}
  .btn-go{width:100%;justify-content:center;padding:14px 24px;font-size:18px}
  .cta{padding:12px 30px;font-size:18px}
  .strip,.strip-cap{grid-template-columns:repeat(2,1fr)}
  .step{padding:8px 20px}
  .jar-label{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── glass cards (프리즘 유리 패널) ── */
.card{background:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.035) 36%,rgba(199,179,255,.07) 64%,rgba(255,255,255,.13));-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#fff;border-radius:18px;isolation:isolate;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.14),inset 1px 0 0 rgba(255,255,255,.28),-1.5px 0 0 rgba(0,235,255,.5),1.5px 0 0 rgba(255,40,210,.45),0 1.5px 0 rgba(255,230,90,.3),0 22px 50px rgba(0,0,0,.6),0 0 44px rgba(150,120,255,.16)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(0,229,255,.85),rgba(150,120,255,.55),rgba(255,40,210,.85),rgba(255,236,140,.85),rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.75;z-index:5}
.card::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.16) 47%,rgba(190,240,255,.1) 50%,rgba(255,180,240,.08) 53%,transparent 60%);transform:translateX(-30%);transition:transform .9s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:6}
.card:hover::after{transform:translateX(30%)}
.card .chrome{color:#fff}
.card .chrome i{border-color:rgba(255,255,255,.85)}
.card .art{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.45)}
.card-meta h3{color:#fff}
.card-meta small{color:#cfc8e6}
.card .go{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),-1px 0 0 rgba(0,235,255,.45),1px 0 0 rgba(255,40,210,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card .go:hover{background:rgba(199,179,255,.3)}

.grid{position:relative;isolation:isolate}
.grid::before{content:"";position:absolute;inset:-40px -20px;z-index:-1;pointer-events:none;background:radial-gradient(38% 60% at 18% 40%,rgba(140,90,255,.38),transparent 70%),radial-gradient(30% 55% at 62% 70%,rgba(80,200,255,.18),transparent 70%),radial-gradient(34% 60% at 88% 30%,rgba(255,90,210,.2),transparent 70%);filter:blur(10px)}

/* 카드 위에 Higgsfield 유리판 이미지를 겹쳐 진짜 유리처럼 */
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.01) 40%,rgba(255,255,255,.04))!important;box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 40px rgba(150,120,255,.12)!important;border-radius:22px!important}
.card::before{padding:0!important;-webkit-mask:none!important;mask:none!important;background:var(--glass-img) center/100% 100% no-repeat!important;mix-blend-mode:screen;opacity:1!important;inset:-3px!important;border-radius:22px}
.card{padding:12px 16px 16px!important}
.card .chrome{padding:4px 6px 8px}

/* 유리판 뒤집기 → 작품으로 이동 */
.grid{perspective:1400px}
.card.flip-a{transition:transform .26s cubic-bezier(.5,0,.75,0)!important;transform:rotateY(90deg)!important}
.card.flip-b{transition:transform .44s cubic-bezier(.2,1,.4,1)!important;transform:rotateY(180deg) scale(1.06)!important;z-index:20}
.card.flip-b > :not(.card-back){visibility:hidden}
.card-back{display:none;position:absolute;inset:0;z-index:7;transform:rotateY(180deg);place-content:center;justify-items:center;gap:12px;padding:20px;text-align:center;border-radius:inherit;background:radial-gradient(70% 60% at 50% 45%,rgba(199,179,255,.35),rgba(120,90,255,.12) 60%,transparent),linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02))}

.card-back span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.16em;color:var(--lav)}
.card-back b{font-size:clamp(26px,3vw,40px);font-weight:400;color:#fff;text-shadow:0 0 .2em rgba(199,179,255,.9)}
.card-back small{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;color:#cfc8e6;animation:labBlink 1s steps(2,start) infinite}

/* 유리 슬라이드 다듬기: 무지갯빛 낮추기 + 라벨 + 모바일 얇은 테두리 */
.card::before{filter:saturate(.32) brightness(1.08) drop-shadow(0 0 6px rgba(199,179,255,.25))}

@media (max-width:640px){

  .card .chrome .slide-no{font-size:9px;padding:1px 5px;letter-spacing:.06em}
}

/* 레퍼런스처럼: 얇고 맑은 유리판 + 가는 흰 테두리 + 반짝임 */
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 38%,rgba(10,8,20,.35))!important;border-radius:16px!important;padding:12px 12px 14px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 22px 44px rgba(0,0,0,.6),0 18px 40px -20px rgba(199,179,255,.35)!important}
.card::before{inset:0!important;padding:1px!important;border-radius:inherit!important;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.22) 35%,rgba(255,255,255,.12) 70%,rgba(199,179,255,.55))!important;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0)!important;-webkit-mask-composite:xor!important;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)!important;filter:none!important;mix-blend-mode:normal!important;opacity:1!important}

.grid::before{opacity:.45}

/* 모바일 다듬기: 라벨 줄이기 · 터치에서 hover 끄기 · 반짝임 위치 */

@media (hover:none){

}

/* ── 원형 회전 배치 ── */
.ring-stage{--w:min(300px,70vw);--r:calc(var(--w) * .78);position:relative;height:calc(var(--w) * 1.56 + 70px);perspective:1800px;perspective-origin:50% 40%;touch-action:pan-y;user-select:none;margin-top:10px}
.idcs.oring{display:block!important;position:absolute;left:50%;top:20px;width:var(--w);height:calc(var(--w) * 1.56);margin-left:calc(var(--w) / -2);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1);overflow:visible!important;padding:0!important}
.oring .idc{position:absolute!important;inset:0;width:auto!important;flex:none!important;aspect-ratio:auto!important;transform-style:preserve-3d;transition:opacity .6s,filter .6s}
.oring .idc.is-side{opacity:.45;filter:saturate(.6) brightness(.8)}
.oring .idc.is-back{opacity:.12;pointer-events:none}
.oring .idc:not(.is-front) .idc-in{transform:none!important}
.ring-stage::after{content:"";position:absolute;left:15%;right:15%;bottom:6px;height:40px;background:radial-gradient(50% 50% at 50% 50%,rgba(150,120,255,.35),transparent 70%);filter:blur(6px);pointer-events:none}
.ring-ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.ring-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(220,210,255,.6);background:transparent;color:#fff;font-size:18px;cursor:pointer}
.ring-btn:hover{background:rgba(199,179,255,.18)}
.ring-dots{display:flex;gap:6px}
.ring-dot{min-width:38px;height:28px;border-radius:999px;border:1px solid rgba(220,210,255,.35);background:transparent;color:#bdb3dc;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;cursor:pointer}
.ring-dot.on{background:#c7b3ff;color:#120e22;border-color:#c7b3ff}
@media (prefers-reduced-motion:reduce){.idcs.oring{transition:none}}
.oring .idc{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s!important}
.oring .idc.is-side{opacity:.5}
.oring .idc.is-back{opacity:.18}
.ring-stage{overflow:hidden}
@media (prefers-reduced-motion:reduce){.oring .idc{transition:none!important}}
.oring .idc.is-back{opacity:0!important;visibility:hidden}

/* 뒤 카드 톤 다운 */
.oring .idc.is-side{opacity:.28!important;filter:saturate(.4) brightness(.6) blur(.6px)!important}

button.jar{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}

const glowCls = w => w.glow === "neon" ? [" glow-bg"," glow-t"] : w.glow === "torch" ? [" torch-bg"," torch-t"] : ["",""];

function art(w, size){
  const n = Math.max(2, [...w.sample].length);
  const sz = size === "lg" ? "l" : "s";
  if (w.fontFamily){
    const g = glowCls(w);
    return `<div class="art art-custom${g[0]}" style="background:${esc(w.bg)};color:${esc(w.ink)}"><span class="glyph${g[1]}" style="--n:${n};--s:${w.scale || 1};font-family:'${esc(w.fontFamily)}',var(--body)">${esc(w.sample)}</span></div>`;
  }
  if (w.style === "puffy") return `<div class="art art-puffy">
      <span class="deco" style="left:7%;top:12%;width:14%;color:#fff">${ICON.spark}</span>
      <span class="glyph puff-${sz}" style="--n:${n}">${esc(w.sample)}</span></div>`;
  if (w.style === "mongle") return `<div class="art art-mongle">
      <svg class="deco" viewBox="0 0 100 75" style="inset:0;width:100%;height:100%" fill="none" stroke="#000" stroke-width=".5"><path d="M-2 8c6-6 12-2 14 2 3-7 13-7 16 0 4-5 11-3 12 3M60 70c0-8 8-11 12-6 2-8 14-9 16-1 6-3 12 2 12 8M-2 72c2-6 10-8 14-2 3-6 10-5 13 1"/></svg>
      <span class="glyph puff-${sz}" style="--n:${n}">${esc(w.sample)}</span></div>`;
  if (w.style === "pixel") return `<div class="art art-pixel">
      <i class="sq" style="left:8%;top:8%"></i><i class="sq" style="left:11.2%;top:11.2%"></i><i class="sq" style="right:10%;top:8%"></i>
      <i class="sq" style="left:4%;bottom:14%"></i><i class="sq" style="right:8%;bottom:20%"></i>
      <canvas data-pixel="${esc(w.sample)}" data-color="#111" width="10" height="10" aria-label="${esc(w.sample)}"></canvas></div>`;
  return `<div class="art art-glass">
      <i class="ring" style="width:30cqw;height:30cqw;left:-8cqw;top:-6cqw"></i>
      <i class="ring" style="width:44cqw;height:44cqw;right:-14cqw;bottom:-26cqw"></i>
      <span class="glyph glass-t" style="--n:${n}">${esc(w.sample)}</span></div>`;
}

function specimen(w){
  const n = Math.max(2, [...w.sample].length);
  if (w.fontFamily) return `<span class="spec${glowCls(w)[1]}" style="--n:${n};--s:${w.scale || 1};font-family:'${esc(w.fontFamily)}',var(--body)">${esc(w.sample)}</span>`;
  if (w.style === "pixel") return `<span class="spec"><canvas data-pixel="${esc(w.sample)}" data-color="#fff" width="10" height="10" aria-label="${esc(w.sample)}"></canvas></span>`;
  if (w.style === "glass") return `<span class="spec glass-t" style="--n:${n}">${esc(w.sample)}</span>`;
  return `<span class="spec puff-s" style="--n:${n};font-family:${w.style === "mongle" ? '"Black Han Sans"' : "var(--round)"}">${esc(w.sample)}</span>`;
}

function dlAttr(w, fmt){
  const f = FONT_FILES[w.id] && FONT_FILES[w.id][fmt];
  if (f && f.file) return `href="${esc(f.file)}" download`;
  if (f && f.b64) return `href="#" data-dl="${w.id}" data-fmt="${fmt}"`;
  return `href="#" data-missing="file"`;
}

function tunnelSVG(){
  const N = 6, L = [];
  for (let i = 1; i <= N; i++){ const t = Math.pow(i / (N + 1), 1.35) * 230; L.push(`<rect x="${t}" y="${t}" width="${600 - 2 * t}" height="${600 - 2 * t}"/>`); }
  const inner = Math.pow(N / (N + 1), 1.35) * 230, k = 8;
  for (let j = 0; j <= k; j++){
    const o = j * 600 / k, q = inner + j * (600 - 2 * inner) / k;
    L.push(`<line x1="${o}" y1="0" x2="${q}" y2="${inner}"/>`, `<line x1="${o}" y1="600" x2="${q}" y2="${600 - inner}"/>`,
           `<line x1="0" y1="${o}" x2="${inner}" y2="${q}"/>`, `<line x1="600" y1="${o}" x2="${600 - inner}" y2="${q}"/>`);
  }
  return `<svg class="p-grid" viewBox="0 0 600 600" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke">${L.join("")}</g><rect x="0" y="0" width="600" height="600" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function marqueeHTML(){

}

function glyphSet(w){

    const ini = [0,2,3,5,6,7,9,11,12,14,15,16,17,18], vow = [0,2,4,6,8,12,13,17,18,20];
    const syl = []; ini.forEach(i => vow.forEach(v => syl.push(String.fromCharCode(0xAC00 + (i * 21 + v) * 28))));
    return [..."ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ", ...syl, ..."강난달람맘밥산앙잘참칼탑팔한", ..."0123456789!?.,~"];
  }
  return [..."ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?&@#$%*()[]<>.,:;-_+=/~^'", '"'];
}
function showSpec(id){

/* ── pixel canvas sample ── */
function drawPixels(){
  document.querySelectorAll("canvas[data-pixel]").forEach(cv => {
    const text = cv.dataset.pixel, h = 22, w = [...text].length * 21 + 4;
    const col = cv.dataset.color || "#111";
    const rgb = [1,3,5].map(i => parseInt(col.length === 4 ? col[Math.ceil(i/2)].repeat(2) : col.slice(i,i+2),16));
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.font = `19px "Black Han Sans"`; ctx.textBaseline = "middle"; ctx.textAlign = "center"; ctx.fillStyle = "#000";
    ctx.fillText(text, w/2, h/2 + 1);
    const img = ctx.getImageData(0,0,w,h), d = img.data;
    for (let i = 0; i < d.length; i += 4){ const on = d[i+3] > 90; d[i]=rgb[0]; d[i+1]=rgb[1]; d[i+2]=rgb[2]; d[i+3] = on ? 255 : 0; }
    ctx.putImageData(img,0,0);
  });
}

/* ── 3D glass F (three.js) ── */
let G3 = null;
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js";
function loadThree(){
  if (window.THREE) return Promise.resolve(window.THREE);
  if (loadThree.p) return loadThree.p;
  loadThree.p = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = THREE_URL; sc.onload = () => res(window.THREE); sc.onerror = rej; document.head.appendChild(sc); });
  return loadThree.p;
}
function stop3D(){ if (G3){ G3.dispose(); G3 = null; } }
function start3D(){
  const canvas = document.querySelector(".p-3d"); if (!canvas) return;
  Promise.all([loadThree(), document.fonts ? document.fonts.load('330px "Dela Gothic One"', "FREE FONT").catch(()=>{}) : 0]).then(([THREE]) => {
    if (!document.body.contains(canvas)) return;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:"high-performance" }); }
    catch(e){ return; }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, .1, 60); camera.position.set(0, 0, 11);

    // 로고 글자 텍스처 (크롬 그라데이션 / 옆면용 마스크)
    const W = 2048, H = 1400, LINES = [["FREE", -.16], ["FONT", .12]];
    const mk = (fill) => {
      const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
      const size = 520; x.font = `${size}px "Dela Gothic One"`; x.textAlign = "center"; x.textBaseline = "middle";
      x.translate(W / 2, H / 2); x.rotate(-4 * Math.PI / 180); x.transform(1, 0, Math.tan(-14 * Math.PI / 180), 1, 0, 0);
      LINES.forEach(([t, dx], i) => {
        const y = (i - .5) * size * .9, px = dx * W * .5;
        x.fillStyle = fill(x, size, y); x.fillText(t, px, y);
        if (fill.stroke){ x.lineWidth = 9; x.strokeStyle = "rgba(255,255,255,.95)"; x.strokeText(t, px, y); }
      });
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
    };
    const chromeFill = (x, size, y) => { const g = x.createLinearGradient(0, y - size * .42, 0, y + size * .42);
      [[0,"#ffffff"],[.3,"#efe8ff"],[.47,"#a58df0"],[.52,"#2e2158"],[.62,"#6c55c4"],[.82,"#efe6ff"],[1,"#ffffff"]].forEach(([o,c]) => g.addColorStop(o,c)); return g; };
    chromeFill.stroke = true;
    const faceTex = mk(chromeFill), maskTex = mk(() => "#ffffff");

    const logo = new THREE.Group(); scene.add(logo);
    const PW = 5.6, PH = PW * H / W, DEPTH = .42, N = 56;
    const plane = new THREE.PlaneGeometry(PW, PH);
    const faceMat = new THREE.MeshBasicMaterial({ map:faceTex, transparent:true, alphaTest:.5, side:THREE.DoubleSide });
    const sideMats = [];
    for (let i = 0; i < N; i++){
      const z = -DEPTH / 2 + DEPTH * i / (N - 1), edge = i === 0 || i === N - 1;
      let m = faceMat;
      if (!edge){ const k = Math.abs(i / (N - 1) - .5) * 2; m = new THREE.MeshBasicMaterial({ map:maskTex, transparent:true, alphaTest:.5, side:THREE.DoubleSide,
        color:new THREE.Color().setRGB(.22 + .5 * k, .16 + .4 * k, .5 + .45 * k) }); sideMats.push(m); }
      const mesh = new THREE.Mesh(plane, m); mesh.position.z = z; logo.add(mesh);
    }

    // 행성 고리처럼 기울어진 연보라 띠 (글자 앞뒤를 지나감)
    const ringMat = new THREE.ShaderMaterial({
      vertexShader:`varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
      fragmentShader:`varying vec3 vN; varying vec3 vV; void main(){ vec3 n = normalize(vN), v = normalize(vV); float ndv = clamp(dot(n, v), 0.0, 1.0);
        vec3 base = vec3(.78,.70,1.0); vec3 col = base * (.72 + .38 * ndv) + vec3(1.) * pow(clamp(n.y * .6 + .5, 0., 1.), 8.) * .35;
        gl_FragColor = vec4(col, 1.0); }` });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.35, .1, 24, 280), ringMat);
    const orbit = new THREE.Group(); orbit.add(ring);
    ring.rotation.x = 1.3;           // 고리를 눕혀서 타원으로
    orbit.rotation.z = .34;           // 대각선 기울기
    ring.scale.set(1.15, 1, 1); orbit.position.set(.05, -.05, 0);
    logo.add(orbit);

    const setFace = (ang) => { const c = .78 + .32 * Math.abs(Math.cos(ang)); faceMat.color.setRGB(c, c, Math.min(1.1, c + .06)); };
    const gridEl = canvas.parentElement.querySelector(".p-grid");
    const barEl = canvas.parentElement.querySelector(".p-bar i"), degEl = canvas.parentElement.querySelector(".p-deg");
    let lastDeg = -1;

    // 상호작용: 좌우 드래그로 가로축 회전 + 관성 + 대기 중 천천히 회전
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let ry = -.5, vy = 0, drag = false, lx = 0, lastMove = 0, hoverY = 0;
    const onDown = e => { drag = true; lx = e.clientX; vy = 0; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); };
    const onMove = e => {
      const r = canvas.getBoundingClientRect(); hoverY = (e.clientY - r.top) / r.height - .5;
      if (!drag) return; const dx = e.clientX - lx; lx = e.clientX; vy = dx * .011; ry += vy; lastMove = performance.now();
    };
    const onUp = () => { drag = false; canvas.classList.remove("drag"); lastMove = performance.now(); };
    canvas.addEventListener("pointerdown", onDown); canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp); canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("pointerleave", () => { hoverY = 0; });

    const resize = () => { const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h;
      camera.position.z = 11 * Math.max(1, 1.45 / camera.aspect); camera.updateProjectionMatrix(); };
    const ro = new ResizeObserver(resize); ro.observe(canvas); resize();
    let visible = true, raf = 0, t0 = performance.now();
    const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; }); io.observe(canvas);
    const tick = now => {
      raf = requestAnimationFrame(tick);
      if (!visible || document.hidden) return;
      const t = (now - t0) / 1000;
      if (!drag){ vy *= .955; ry += vy; if (!reduce && now - lastMove > 1500) ry += .0006; }
      const br = canvas.getBoundingClientRect(), sp = Math.min(1, Math.max(0, -br.top / br.height));   // 스크롤 진행도
      logo.rotation.set(-.06 + hoverY * .12, ry + (reduce ? 0 : sp * Math.PI * 1.3), 0);
      logo.scale.setScalar(reduce ? 1 : 1 - sp * .28);
      if (gridEl && !reduce) gridEl.style.transform = `scale(${1 + sp * .45})`;
      logo.position.y = reduce ? 0 : Math.sin(t * 1.1) * .06;
      setFace(ry);
      const deg = Math.round(((ry * 180 / Math.PI) % 360 + 360) % 360);
      if (deg !== lastDeg){ lastDeg = deg; degEl.textContent = deg + "°"; barEl.style.width = (deg / 3.6) + "%"; }
      renderer.render(scene, camera);
    };
    renderer.compile(scene, camera);
    raf = requestAnimationFrame(tick);
    requestAnimationFrame(() => { canvas.classList.add("on"); canvas.closest(".p-box").classList.add("live"); });
    G3 = { dispose(){ cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); scene.traverse(o => { if (o.geometry) o.geometry.dispose(); }); [faceMat, ringMat, ...sideMats].forEach(m => m.dispose()); faceTex.dispose(); maskTex.dispose(); renderer.dispose(); } };
  }).catch(() => {});
}

/* 미리보기 글자가 비커·카드 밖으로 넘치면 자동으로 줄이기 */
function fitSpecs(){

    const r = document.createRange(); r.selectNodeContents(el); const w = Math.max(el.scrollWidth, r.getBoundingClientRect().width);
    if (w > max && max > 0){
      const fs = parseFloat(getComputedStyle(el).fontSize);

/* 연구원 출입증 원형 회전 */
let ringIdx = 0, ringSwiped = false;
function ringUpdate(){
  const ring = $(".oring"); if (!ring) return;
  const cards = [...ring.querySelectorAll(".idc")], n = cards.length, step = 2 * Math.PI / n;
  const W = ring.offsetWidth, R = W * .92;
  ring.style.transform = "none";
  const cur = ((ringIdx % n) + n) % n;
  cards.forEach((c, i) => {
    let t = (i - ringIdx) * step; t = Math.atan2(Math.sin(t), Math.cos(t));      // -π ~ π
    const x = Math.sin(t) * R, z = (Math.cos(t) - 1) * R * .9, ry = -t * 180 / Math.PI * .35;
    c.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${ry.toFixed(1)}deg)`;
    c.style.zIndex = Math.round((Math.cos(t) + 1) * 10);
    const d = ((i - cur) % n + n) % n;
    c.classList.toggle("is-front", d === 0); c.classList.toggle("is-side", d === 1 || d === n - 1); c.classList.toggle("is-back", d !== 0 && d !== 1 && d !== n - 1);
    c.setAttribute("aria-hidden", d === 0 ? "false" : "true"); c.tabIndex = d === 0 ? 0 : -1;
    if (d !== 0 && c.classList.contains("flipped")){ c.classList.remove("flipped"); c.setAttribute("aria-pressed", "false"); }
  });
  document.querySelectorAll(".ring-dot").forEach((b, i) => b.classList.toggle("on", i === cur));
}
function ringGo(delta){ ringIdx += delta; ringUpdate(); }
function ringTo(i){ const n = document.querySelectorAll(".oring .idc").length, cur = ((ringIdx % n) + n) % n; let d = i - cur; if (d > n / 2) d -= n; if (d < -n / 2) d += n; ringGo(d); }
function initRing(){ ringIdx = 0; ringUpdate(); }
addEventListener("resize", () => ringUpdate());
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-ring]"); if (b){ ringGo(+b.dataset.ring); return; }
  const g = e.target.closest && e.target.closest("[data-ring-go]"); if (g){ ringTo(+g.dataset.ringGo); }
});
document.addEventListener("keydown", e => {
  if (!$(".oring") || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") ringGo(-1); else if (e.key === "ArrowRight") ringGo(1);
});
let ringX = null;
document.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest(".ring-stage")) ringX = e.clientX; else ringX = null; });
document.addEventListener("pointerup", e => {
  if (ringX === null) return; const dx = e.clientX - ringX; ringX = null;
  if (Math.abs(dx) > 40){ ringSwiped = true; ringGo(dx < 0 ? 1 : -1); setTimeout(() => ringSwiped = false, 50); }
});

/* 연구원 카드: 누르면 앞(사원증)/뒤(연구원 파일) 뒤집기 */

});

  j.classList.add("filling");
  setTimeout(() => { location.hash = j.getAttribute("href"); }, 1050);
}, true);

/* ── 스크롤 효과: 제목 해독 + 순서대로 등장 ── */
let scrollIO = null;
const GLYPHS = "▚▞▖▗▘▝#%&*+=<>/\\|01ABCDEFGHJKLMNPRSTUVXYZ";
function decode(el){
  const final = el.dataset.final || (el.dataset.final = el.textContent);
  const t0 = performance.now(), dur = 700;
  cancelAnimationFrame(el._raf);
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), done = Math.floor(final.length * k);
    el.textContent = final.split("").map((c, i) => c === " " ? " " : i < done ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0]).join("");
    if (k < 1) el._raf = requestAnimationFrame(step); else el.textContent = final;
  };
  el._raf = requestAnimationFrame(step);
}
let mqRaf = 0;
function initMarquee(){
  cancelAnimationFrame(mqRaf);
  const tracks = [...document.querySelectorAll(".mq-track")]; if (!tracks.length) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let x = 0, lastY = scrollY, boost = 0;
  const tick = () => {
    mqRaf = requestAnimationFrame(tick);
    const dy = scrollY - lastY; lastY = scrollY;
    boost += (Math.min(40, Math.abs(dy)) * .35 - boost) * .12;      // 스크롤 속도만큼 빨라짐
    x += reduce ? 0 : (.6 + boost) * (dy < 0 ? -1 : 1);
    tracks.forEach((t, i) => { const w = t.scrollWidth / 4; const v = ((x % w) + w) % w; t.style.transform = `translateX(${i ? v - w : -v}px)`; });
  };
  tick();
}
function initScrollFX(){
  if (scrollIO) scrollIO.disconnect();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const app = $("#app");
  app.querySelectorAll(".head h2").forEach(h => h.classList.add("dec"));
  const groups = [".card", ".jar-item", ".step", "table tbody tr", ".stmt", ".tester", ".report", ".p-panel", ".ring-stage", ".chat"];
  groups.forEach(sel => app.querySelectorAll(sel).forEach((el, i) => { el.classList.add("rv"); el.style.setProperty("--d", (i % 6) * 90 + "ms"); }));
  scrollIO = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; scrollIO.unobserve(el);
    if (el.classList.contains("dec")) decode(el); else el.classList.add("in");
  }), { threshold:.15, rootMargin:"0px 0px -8% 0px" });
  app.querySelectorAll(".dec, .rv").forEach(el => scrollIO.observe(el));
}

/* ── router ── */
let lastRoute = null;
function render(){
  const r = (location.hash || "#home").slice(1) || "home";
  $("#top").innerHTML = header(r);
  stop3D();
  $("#app").innerHTML = r.startsWith("work-") ? VIEWS.work(r.slice(5)) : (VIEWS[r] || VIEWS.notfound)();
  drawPixels();
  start3D();
  initScrollFX();
  initRing();
  fitSpecs(); setTimeout(fitSpecs, 400);
}
/* 화면 전환: 연보라 스캔 라인이 위에서 아래로 훑으며 새 페이지를 드러냄 */
function scanTransition(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let sc = $("#pg-scan");
  if (!sc){ sc = document.createElement("div"); sc.id = "pg-scan"; sc.className = "pg-scan"; sc.setAttribute("aria-hidden", "true"); sc.innerHTML = "<i></i>"; document.body.appendChild(sc); }
  const app = $("#app");
  [sc, app].forEach(el => { el.classList.remove("run", "scan-in"); void el.offsetWidth; });
  sc.classList.add("run"); app.classList.add("scan-in");
  clearTimeout(scanTransition.t);
  scanTransition.t = setTimeout(() => { sc.classList.remove("run"); app.classList.remove("scan-in"); }, 700);
}
function navigate(){
  const r = location.hash || "#home";
  render();
  if (r !== lastRoute){ window.scrollTo(0,0); if (lastRoute !== null) scanTransition(); }
  lastRoute = r;
}

/* ── events ── */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }

document.addEventListener("click", e => {
  const m = e.target.closest("[data-missing]");
  if (m){ e.preventDefault(); toast(m.dataset.missing === "file" ? "폰트 파일은 곧 올라와요." : "인터랙티브 사이트는 곧 공개돼요."); return; }
  const d = e.target.closest("[data-dl]");
  if (d){ e.preventDefault(); saveFont(d.dataset.dl, d.dataset.fmt); return; }
  if (e.target.closest("[data-help]")){ $("#help").showModal(); return; }
  const c = e.target.closest("[data-cat]"); if (c){ state.cat = c.dataset.cat; render(); return; }
  const p = e.target.closest("[data-proc]"); if (p){ state.proc = +p.dataset.proc; render(); return; }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-sort]")){ state.sort = e.target.value; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-q]")){ state.q = t.value; $("#arch-list").innerHTML = archList(); drawPixels(); }
  if (t.matches("[data-tester]")) $("#tout").textContent = t.value || " ";
  if (t.matches("[data-size]")){ state.testSize = +t.value; $("#tout").style.fontSize = t.value + "px"; }
});

/* ── student fonts ── */
const fontBytes = (id, fmt) => Uint8Array.from(atob(FONT_FILES[id][fmt].b64), c => c.charCodeAt(0));
Object.keys(FONT_FILES).forEach(id => {
  const ff = FONT_FILES[id], t = ff.ttf;
  try {
    const src = t.b64 ? fontBytes(id,"ttf").buffer : (ff.woff2 ? `url("${encodeURI(ff.woff2)}") format("woff2"), url("${encodeURI(t.file)}")` : `url("${encodeURI(t.file)}")`);
    new FontFace(ff.family, src).load().then(x => { document.fonts.add(x); fitSpecs(); setTimeout(fitSpecs, 300); }).catch(() => {});
  } catch(e){}
});
let saving = false;
/* 아주 작은 zip 만들기 (압축 없이 묶기) — OTF는 Claude 저장 기능이 직접 받지 않아서 zip으로 감싸요 */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(name, data){
  const nm = new TextEncoder().encode(name), crc = crc32(data), sz = data.length;
  const lh = new DataView(new ArrayBuffer(30)), ch = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
  [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,sz,4],[22,sz,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,l]) => l === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
  [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,crc,4],[20,sz,4],[24,sz,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]].forEach(([o,v,l]) => l === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
  const cdOff = 30 + nm.length + sz, cdSize = 46 + nm.length;
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,cdSize,4],[16,cdOff,4],[20,0,2]].forEach(([o,v,l]) => l === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([lh, nm, data, ch, nm, end], { type:"application/zip" });
}
async function saveFont(id, fmt){
  if (saving) return;
  const f = FONT_FILES[id][fmt];
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (!dl){ toast("이 화면에서는 다운로드를 할 수 없어요."); return; }
  saving = true;
  const bytes = fontBytes(id, fmt);
  const isOtf = fmt === "otf";
  const filename = isOtf ? f.filename.replace(/\.otf$/i, "-OTF.zip") : f.filename;
  const data = isOtf ? makeZip(f.filename, bytes) : new Blob([bytes]);
  try {
    await dl.save({ filename, data });
    toast(isOtf ? `${f.filename} 을 zip으로 저장했어요. 압축을 풀어 설치하세요.` : `${f.filename} 저장을 시작했어요.`);
  } catch(err){
    if (err && err.code === "declined") return;
    toast(err && err.code === "rate_limited" ? "잠시 후 다시 눌러 주세요." : "다운로드하지 못했어요. 잠시 후 다시 시도해 주세요.");
  } finally { saving = false; }
}

window.addEventListener("hashchange", navigate);
navigate();
if (document.fonts){ document.fonts.load('19px "Black Han Sans"', "픽셀체").then(drawPixels).catch(()=>{}); document.fonts.ready.then(drawPixels); }
</script>
