<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>털어 놓아봐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"JuHyeonho";src:url("../fonts/JuHyeonho-Regular.woff2") format("woff2");font-display:swap}
:root{
  --bg:linear-gradient(180deg,#E8EF92 0%,#EEF2B8 12%,#F7F8E6 26%,#FFFFFF 38%,#FBEAF6 49%,#F4B4EA 62%,#EC7EE0 80%,#E35FD6 100%);
  --title:#3C7BE9; --ink:#27306A; --muted:#A4AECB;
  --lime:#A7EC5F; --cyan:#B6E9F1; --yellow:#F2E34C; --orange:#F0A24B; --coral:#E8775A;
  --paper:#FFFFFF; --paper-line:#E0E8F8;
  --river-top:66%;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#FFF;font-family:"JuHyeonho","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.deco{position:absolute;pointer-events:none}

.bar{position:absolute;height:clamp(8px,1vw,16px);border-radius:99px;background:var(--cyan);pointer-events:none}
.dots{position:absolute;display:flex;gap:clamp(4px,.5vw,8px);pointer-events:none}
.dots i{width:clamp(9px,1.15vw,18px);aspect-ratio:1;border-radius:50%;background:var(--orange)}
.dots.col{flex-direction:column}
.circ{position:absolute;border-radius:50%;background:var(--yellow);pointer-events:none;aspect-ratio:1}
.pix{position:absolute;filter:blur(8px);opacity:.75;pointer-events:none}
.sway{animation:sway 7s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes sway{to{transform:skewX(2.5deg) translateX(3px)}}

.made{position:absolute;left:clamp(16px,2.3vw,44px);top:calc(env(safe-area-inset-top,0px) + clamp(14px,2.4vw,30px));z-index:6;margin:0;
  font-family:"Josefin Sans","Avenir Next","Century Gothic",sans-serif;font-weight:300;font-size:clamp(14px,2.5vw,46px);letter-spacing:.03em;color:#1E2140;line-height:1;display:flex;align-items:center;gap:.4em}

.made .dots{position:static}

.title{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + clamp(60px,10vh,120px));z-index:5;margin:0;font-weight:400;text-align:center;color:var(--title);pointer-events:none;line-height:1}
@media (min-width:720px){.title{top:calc(env(safe-area-inset-top,0px) + 14vh)}}
.title .s{display:block;font-size:clamp(20px,5vw,38px);-webkit-text-stroke:.7px var(--title);margin-bottom:.2em}
.title .b{display:block;font-size:clamp(28px,7vw,52px);-webkit-text-stroke:1px var(--title);word-spacing:.1em}

/* stage */
.stage{position:absolute;left:0;right:0;top:30%;bottom:calc(100% - var(--river-top) + 6%);display:flex;align-items:center;justify-content:center;z-index:7}
.paperWrap{position:relative;width:min(82vw,400px);height:min(100%,380px);filter:drop-shadow(0 14px 24px rgba(60,80,170,.18));transition:transform .6s cubic-bezier(.6,0,.3,1),opacity .5s}
.paper{position:absolute;inset:0;background:var(--paper);border-radius:3px;
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,var(--paper-line) 33px 34px);background-position:0 16px;
  clip-path:polygon(50% 0,100% 0,100% 30%,100% 100%,50% 100%,0 100%,0 30%,0 0);transition:clip-path .7s cubic-bezier(.65,0,.3,1)}
textarea{position:absolute;left:20px;right:18px;top:16px;bottom:62px;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:22px;line-height:34px;color:var(--ink);transition:opacity .6s}
textarea::placeholder{color:var(--muted)}
.send{position:absolute;right:16px;bottom:14px;font:inherit;font-size:19px;color:#fff;background:var(--title);border:0;border-radius:999px;padding:7px 22px 9px;cursor:pointer;transition:transform .15s,filter .2s}
.send:hover{filter:brightness(1.07)}.send:active{transform:scale(.96)}
.send:focus-visible,.x:focus-visible,.boat:focus-visible,.plane:focus-visible{outline:2px solid var(--coral);outline-offset:4px}
.count{position:absolute;left:20px;bottom:20px;font-size:15px;color:var(--muted)}
.folds{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.flap{fill:#F2F5FC;stroke:#DCE4F5;stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .4s .35s}
.flap.on{opacity:1}
.fline{cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.fline.on{opacity:1;pointer-events:auto}
.fline .vis{stroke:var(--title);stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;fill:none;animation:march 1.2s linear infinite}
.fline .hit{pointer-events:stroke;stroke:transparent;stroke-width:34;vector-effect:non-scaling-stroke}
.fline:hover .vis,.fline:focus .vis{stroke:var(--coral);stroke-width:3}
.fline:focus{outline:none}
@keyframes march{to{stroke-dashoffset:-12}}
.hint{position:absolute;left:0;right:0;bottom:calc(100% - var(--river-top) + 1.6%);text-align:center;z-index:9;font-size:clamp(16px,4.3vw,20px);color:var(--title);pointer-events:none;opacity:0;transition:opacity .4s}
.hint.on{opacity:1}
.hint span{background:rgba(255,255,255,.85);padding:4px 14px 6px;border-radius:999px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.plane{position:absolute;left:50%;top:50%;width:min(46vw,200px);aspect-ratio:2/1.15;z-index:8;touch-action:none;cursor:grab;opacity:0;pointer-events:none;transition:opacity .4s;transform:translate(-50%,-50%)}
.plane.on{opacity:1;pointer-events:auto}
.plane.drag{cursor:grabbing}
.plane svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 12px rgba(60,80,170,.22))}
.sling{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}

/* water: clear glass over the gradient */
.under{z-index:1;opacity:.85}
.boat{position:absolute;left:0;top:0;width:min(36vw,160px);z-index:5;cursor:pointer;background:none;border:0;padding:0;visibility:hidden;will-change:transform}
.boat svg{display:block;width:100%;overflow:visible}
.boat .hullsvg{-webkit-mask-image:linear-gradient(180deg,#000 80%,rgba(0,0,0,.35) 90%,rgba(0,0,0,.2));mask-image:linear-gradient(180deg,#000 80%,rgba(0,0,0,.35) 90%,rgba(0,0,0,.2))}
.boat .refl{position:absolute;left:0;top:84%;width:100%;transform:scaleY(-.75);transform-origin:50% 0;opacity:.22;filter:blur(1.6px);
  -webkit-mask-image:linear-gradient(0deg,transparent 10%,#000 90%);mask-image:linear-gradient(0deg,transparent 10%,#000 90%)}
.boat .halo{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;font-size:17px;color:var(--title);background:rgba(255,255,255,.9);border-radius:999px;padding:3px 12px 5px;opacity:0;transition:opacity .4s}
.boat.ready .halo{opacity:1}
.water{position:absolute;left:0;right:0;top:var(--river-top);bottom:0;z-index:3;pointer-events:none;
  -webkit-backdrop-filter:blur(3px) saturate(.9) brightness(1.07);backdrop-filter:blur(3px) saturate(.9) brightness(1.07);
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 12%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.22) 100%)}
#wcv{position:absolute;left:0;right:0;z-index:4;pointer-events:none}
.boatHit{position:absolute;z-index:6;background:none;border:0;padding:0;cursor:pointer;display:none}

/* lifted boat, unfolding */
.veil{position:absolute;inset:0;z-index:18;background:rgba(255,255,255,.3);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .5s}
.veil.on{opacity:1;pointer-events:auto}
.unf{position:absolute;left:50%;top:46%;width:min(76vw,360px);aspect-ratio:1;z-index:19;display:none;transform:translate(-50%,-50%);perspective:900px;cursor:pointer;-webkit-user-select:none;user-select:none;outline:none}
.unf:focus-visible .flip{outline:2px dashed var(--coral);outline-offset:6px}
.hint.up{bottom:auto;top:calc(46% + min(38vw,180px) + 4px);z-index:21}
.unf .flip{width:100%;height:100%;transform-style:preserve-3d}
.unf svg{width:100%;height:100%;overflow:visible}

/* letter */
.letter{position:absolute;left:50%;top:50%;z-index:20;width:min(88vw,430px);display:none}
.letter .sheet{position:relative;background:var(--paper);padding:30px 24px 22px;border-radius:3px;
  background-image:repeating-linear-gradient(180deg,transparent 0 35px,var(--paper-line) 35px 36px);background-position:0 22px;
  box-shadow:0 22px 44px rgba(60,80,170,.22);max-height:min(72vh,560px);overflow:auto}
.crease{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(60,80,170,.05),rgba(60,80,170,.2),rgba(60,80,170,.05));pointer-events:none}
.crease.v{top:0;bottom:0;left:50%;width:1px;height:auto;background:linear-gradient(180deg,rgba(60,80,170,.05),rgba(60,80,170,.18),rgba(60,80,170,.05))}
.answer{font-size:23px;line-height:36px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-height:108px;margin:0}
.answer .wait{color:var(--muted)}
.ld i{display:inline-block;animation:ld 1.2s infinite;font-style:normal}.ld i:nth-child(2){animation-delay:.2s}.ld i:nth-child(3){animation-delay:.4s}
@keyframes ld{50%{opacity:.15}}
.sign{text-align:right;font-size:19px;color:var(--title);margin:8px 2px 0;line-height:36px}
.note{font-size:14px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.x{position:absolute;right:-10px;top:-16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--title);color:#fff;font:inherit;font-size:24px;line-height:1;cursor:pointer;z-index:3;display:grid;place-items:center;padding-bottom:3px;box-shadow:0 6px 14px rgba(60,80,170,.3)}

.snd{position:absolute;right:clamp(14px,2.3vw,44px);top:calc(env(safe-area-inset-top,0px) + clamp(8px,1.8vw,22px));z-index:12;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.7);color:#3C7BE9;display:grid;place-items:center;cursor:pointer}
.snd svg{width:22px;height:22px}.snd .m{display:none}.snd[aria-pressed="false"] .m{display:block}.snd[aria-pressed="false"] .w{display:none}
.snd:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.plus{width:clamp(24px,3vw,46px)}
.d.d{display:none}
@media (min-width:720px){.d.d{display:block}.dots.d.d{display:flex}}
.grain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;mix-blend-mode:soft-light}
@media (prefers-reduced-motion:reduce){.fline .vis{animation:none!important}}
</style>
</head>
<body>
<div id="scene">
  <p class="made"><span>MADE BY HYOUNHO</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
  <button class="snd" id="snd" aria-pressed="true" aria-label="물소리 끄기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="currentColor"/><path class="w" d="M16 8.5c1.4 1.9 1.4 5.1 0 7M18.6 6c2.6 3.4 2.6 8.6 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="m" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>

  <!-- above-water decor: tidy, mirrored rhythm -->
  <svg class="deco plus" style="right:calc(clamp(14px,2.3vw,44px) + 56px);top:calc(env(safe-area-inset-top,0px) + clamp(12px,2.2vw,28px))" viewBox="0 0 40 40" aria-hidden="true"><g fill="#E8775A"><rect x="15" y="0" width="10" height="40" rx="5"/><rect x="0" y="15" width="40" height="10" rx="5"/></g></svg>
  <div class="bar d" style="left:35%;top:7.2%;width:30%"></div>
  <div class="bar d" style="left:35%;top:10.2%;width:17%"></div>
  <div class="dots d" style="left:53.2%;top:9.85%"><i></i><i></i></div>

  <div class="circ d" style="left:7%;top:31%;width:clamp(44px,5.4vw,96px)"></div>
  <div class="dots col d" style="left:calc(7% + clamp(44px,5.4vw,96px) + 10px);top:31.5%"><i></i><i></i><i></i></div>
  <svg class="deco" id="fernL" style="left:-2.5%;top:41%;width:clamp(100px,15vw,280px);transform:rotate(16deg)" viewBox="0 0 200 200" aria-hidden="true"></svg>

  <div class="circ" style="right:calc(clamp(84px,10vw,180px) * -.45);top:25%;width:clamp(84px,10vw,180px)"></div>
  <div class="dots col d" style="right:calc(clamp(84px,10vw,180px) * .55 + 16px);top:28%"><i></i><i></i><i></i></div>
  <svg class="deco" style="right:6%;top:45%;width:clamp(44px,6vw,110px)" viewBox="0 0 80 70" aria-hidden="true"><g stroke="#A7EC5F" stroke-width="9" stroke-linecap="round"><path d="M14 8 6 52"/><path d="M32 8 24 52"/><path d="M50 8 42 52"/><path d="M68 8 60 52"/></g></svg>

  <div class="bar" style="left:0;top:59.6%;width:15%"></div>
  <div class="bar" style="left:0;top:62.4%;width:8%"></div>
  <div class="bar" style="right:0;top:59.6%;width:15%"></div>
  <div class="bar" style="right:0;top:62.4%;width:8%"></div>

  <!-- under-water decor (seen through the clear water) -->
  <div class="circ under" style="left:5%;top:86%;width:clamp(30px,3vw,56px)"></div>
  <svg class="deco under" style="left:clamp(40px,11vw,230px);bottom:-3%;width:clamp(90px,10vw,190px)" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 120C30 70 60 20 108 6 116 50 104 100 70 120Z" fill="#A7EC5F"/></svg>
  <div class="dots under" style="left:50%;top:91%;transform:translateX(-50%)"><i></i><i></i><i></i></div>
  <svg class="deco under" id="fernB" style="right:clamp(10px,11vw,230px);bottom:-6%;width:clamp(110px,13vw,240px);transform:rotate(-12deg)" viewBox="0 0 200 200" aria-hidden="true"></svg>

  <button class="boat" id="boat" aria-label="종이배 열기">
    <span class="halo">눌러봐</span>
    <svg class="hullsvg" viewBox="0 0 160 100" aria-hidden="true" id="boatSvg">
      <path d="M80 6 106 62H54Z" fill="#FFFFFF" stroke="#D6DEF2" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M80 6 54 62h14Z" fill="#E6ECFA"/>
      <path d="M8 58h144l-26 34H34Z" fill="#FFFFFF" stroke="#D6DEF2" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M8 58 34 92h16L40 58Z" fill="#F7DDF0"/>
    </svg>
    <svg class="refl" viewBox="0 0 160 100" aria-hidden="true"><use href="#boatSvg"/></svg>
  </button>

  <div class="water" aria-hidden="true"></div>
  <canvas id="wcv" aria-hidden="true"></canvas>

  <h1 class="title" id="title" aria-label="너의 고민·생각을 털어 놓아봐"><span class="s" aria-hidden="true">너의 고민·생각을</span><span class="b" aria-hidden="true">털어 놓아봐</span></h1>

  <svg class="sling" id="sling" aria-hidden="true"><line id="slingLine" stroke="#3C7BE9" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" opacity="0"/></svg>

  <div class="stage" id="stage">
    <div class="paperWrap" id="paperWrap">
      <div class="paper" id="paper">
        <textarea id="txt" maxlength="300" placeholder="여기에 적어줘…" aria-label="털어놓을 이야기"></textarea>
        <span class="count" id="count">0 / 300</span>
        <button class="send" id="send">보내기</button>
      </div>
      <svg class="folds" id="folds" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
    <div class="plane" id="plane" tabindex="-1" role="button" aria-label="종이비행기. 왼쪽으로 당겼다 놓으면 날아가요. 엔터로도 날릴 수 있어요.">
      <svg viewBox="0 0 200 115" aria-hidden="true">
        <path d="M196 52 8 4 58 58Z" fill="#FFFFFF" stroke="#D6DEF2" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M196 52 58 58 70 92Z" fill="#DCE5F8" stroke="#D6DEF2" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M196 52 58 58 22 104Z" fill="#F2F5FD" stroke="#D6DEF2" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="hint" id="hint" aria-live="polite"><span id="hintText"></span></div>

  <div class="veil" id="veil"></div>
  <div class="unf" id="unf" role="button" tabindex="-1" aria-label="종이배를 눌러서 조금씩 펼치기">
    <div class="flip" id="flip">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F4FC"/></linearGradient>
        </defs>
        <ellipse id="ushadow" cx="100" cy="196" rx="70" ry="6" fill="#3C4FA0" opacity=".12"/>
        <polygon id="ushape" fill="url(#pg)" stroke="#D6DEF2" stroke-width="1" stroke-linejoin="round"/>
        <g id="udetail"></g>
      </svg>
    </div>
  </div>
  <div class="letter" id="letter" role="dialog" aria-modal="true" aria-label="답장">
    <button class="x" id="close" aria-label="처음으로">×</button>
    <div class="sheet">
      <div class="crease" style="top:33.3%"></div><div class="crease" style="top:66.6%"></div><div class="crease v"></div>
      <p class="answer" id="answer"></p>
      <p class="sign">강 건너에서</p>
      <p class="note" id="note" hidden></p>
    </div>
  </div>

  <div class="grain" id="grain"></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const scene=$('scene'),txt=$('txt'),send=$('send'),paper=$('paper'),paperWrap=$('paperWrap'),folds=$('folds'),
      plane=$('plane'),boat=$('boat'),unf=$('unf'),letter=$('letter'),veil=$('veil'),answerEl=$('answer'),hint=$('hint'),hintText=$('hintText');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
let state='write',foldState={L:0,R:0},reply=null,replyPromise=null,usedFallback=false,timers=[];

/* ---------- decor ---------- */
function fern(el,col){
  let s=`<g stroke="${col}" stroke-width="11" stroke-linecap="round" fill="none"><path d="M8 196C60 150 120 90 186 20"/>`;
  for(let i=1;i<=7;i++){const t=i/8.2,x=8+t*178,y=196-t*176;const len=34-i*2.2;
    s+=`<path d="M${x} ${y}l${-len*.25} ${-len}"/><path d="M${x} ${y}l${len} ${len*.2}"/>`}
  el.innerHTML=s+'</g>';
}
fern($('fernL'),'#A7EC5F');fern($('fernB'),'#A7EC5F');
(function grain(){const n=150,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),d=x.createImageData(n,n);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);
  const g=$('grain');g.style.backgroundImage=`url(${c.toDataURL()})`;g.style.backgroundSize=n*1.2+'px'})();

function layout(){
  const t=$('title').getBoundingClientRect(),s=scene.getBoundingClientRect();
  $('stage').style.top=Math.max(t.bottom-s.top+20,s.height*.2)+'px';
  sizeWater();
}
function setHint(t,up){hint.classList.toggle('up',!!up);if(t){hintText.textContent=t;hint.classList.add('on')}else hint.classList.remove('on')}

/* ---------- water (canvas) ---------- */
const cv=$('wcv'),cx=cv.getContext('2d');let W=0,H=0,top0=0,dpr=1;const PAD=26;
function sizeWater(){
  const s=scene.getBoundingClientRect();top0=s.height*.66;W=s.width;H=s.height-top0+PAD;dpr=Math.min(1.5,devicePixelRatio||1);
  cv.style.top=(top0-PAD)+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;
}
const ripples=[];let boatS={x:-999,v:0,on:false,w:150,stop:false,arr:false,t0:0,x0:0,x1:0,dur:9000,y:null,rot:0,lastX:0};
function base(x,t){return 2.4*Math.sin(x*.016-t*1.25)+1.5*Math.sin(x*.043+t*.9)+.9*Math.sin(x*.006+t*.45)}
function surf(x,t){
  let y=base(x,t);
  if(boatS.on){const d=(x-boatS.x)/(boatS.w*.6);y+=-1.4*Math.exp(-d*d)*(.4+Math.min(1,boatS.v*6))}

const LINES={R1:[50,0,100,30],L1:[50,0,0,30],R2:[50,0,78,100],L2:[50,0,22,100],C:[50,0,50,100]};

  const dx=bx-ax,dy=by-ay,t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);const fx=ax+t*dx,fy=ay+t*dy;

function prompt(msg){
  return `너는 강 건너편에서 종이배에 답장을 실어 보내는 사람이야. 누군가 마음을 적어 종이비행기로 날려 보냈고, 너는 그 마음을 오래 품었다가 조용히 답장을 써.

function pts(a){return a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}
function detail(k,op){const g=document.createElementNS(NS,'g');g.innerHTML=DET[k];g.setAttribute('stroke','#C9D4EE');g.setAttribute('stroke-width','.8');g.style.opacity=op;udet.appendChild(g);return g}
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function morph(a,b,dur,tilt){
  return new Promise(res=>{
    const ga=udet.lastElementChild,gb=detail(b,0),t0=performance.now();
    flip.animate([{transform:'rotateX(0) rotateY(0)'},{transform:tilt,offset:.5},{transform:'rotateX(0) rotateY(0)'}],{duration:dur,easing:'ease-in-out'});
    (function f(now){
      const t=Math.min(1,(now-t0)/dur),e=eio(t);
      ushape.setAttribute('points',pts(SH[a].map((p,i)=>[p[0]+(SH[b][i][0]-p[0])*e,p[1]+(SH[b][i][1]-p[1])*e])));
      if(ga)ga.style.opacity=Math.max(0,1-t/.45);gb.style.opacity=Math.max(0,(t-.55)/.45);
      if(t<1)requestAnimationFrame(f);else{if(ga)ga.remove();res()}
    })(t0);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const STEPS=[['A','B','rotateX(28deg) rotateY(-10deg)'],['B','C','rotateX(-24deg)'],['C','D','rotateY(18deg)'],['D','E','rotateX(20deg) rotateY(-8deg)']];
let ustep=0,ubusy=false;
async function liftBoat(){
  state='lifting';boat.classList.remove('ready');
  const br=boat.getBoundingClientRect();
  boat.style.visibility='hidden';boatS.on=false;boatS.arr=false;
  for(let i=0;i<3;i++)ripples.push({x:boatS.x,r:boatS.w*.2+i*14,a:.8,life:1,vr:22});
  udet.innerHTML='';ushape.setAttribute('points',pts(SH.A));detail('A',1);
  unf.style.display='block';veil.classList.add('on');
  const ur=unf.getBoundingClientRect();
  const k=br.width/(ur.width*.82),dx=(br.left+br.width/2)-(ur.left+ur.width/2),dy=(br.top+br.height*.5)-(ur.top+ur.height*.4);
  await unf.animate([{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${k})`},{transform:'translate(-50%,-50%) scale(1)'}],
    {duration:reduce?200:900,easing:'cubic-bezier(.3,.8,.3,1)'}).finished;
  if(state!=='lifting')return;
  state='unfold';ustep=0;unf.setAttribute('tabindex','0');unf.focus({preventScroll:true});
  setHint('종이배를 눌러서 펼쳐봐',true);
}
async function unfoldStep(){
  if(state!=='unfold'||ubusy)return;
  ubusy=true;const [a,b,tilt]=STEPS[ustep];
  await morph(a,b,reduce?250:680,tilt);ustep++;ubusy=false;
  if(state!=='unfold')return;
  if(ustep>=STEPS.length){setHint('',true);unf.setAttribute('tabindex','-1');await wait(260);if(state==='unfold')openLetter()}
  else setHint(['한 번 더 눌러봐','조금만 더','거의 다 펴졌어'][ustep-1],true);
}
unf.addEventListener('click',unfoldStep);
unf.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();unfoldStep()}});

/* ---------- letter ---------- */
async function openLetter(){
  state='letter';setHint('');
  const ur=unf.getBoundingClientRect();
  letter.style.display='block';const lr=letter.getBoundingClientRect();
  const k=(ur.width*.8)/lr.width;
  unf.animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'}).finished.then(()=>{unf.style.display='none';unf.getAnimations().forEach(a=>a.cancel())});
  letter.animate([{transform:`translate(-50%,-50%) scale(${k})`,opacity:.6},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:reduce?150:520,easing:'cubic-bezier(.3,.8,.3,1)',fill:'forwards'});
  $('close').focus({preventScroll:true});
  answerEl.innerHTML='<span class="wait">답장을 쓰는 중<span class="ld"><i>.</i><i>.</i><i>.</i></span></span>';
  const t=reply||await replyPromise;if(state!=='letter')return;
  $('note').hidden=!usedFallback;
  await wait(reduce?0:500);
  answerEl.textContent='';const chars=[...t];let i=0;
  const step=()=>{if(state!=='letter')return;answerEl.textContent+=chars.slice(i,i+2).join('');i+=2;if(i<chars.length)setTimeout(step,reduce?0:50)};step();
}
$('close').addEventListener('click',reset);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='letter')reset()});
function reset(){
  timers.forEach(clearTimeout);timers=[];state='write';reply=null;replyPromise=null;
  letter.getAnimations().forEach(a=>a.cancel());letter.style.display='none';veil.classList.remove('on');
  unf.getAnimations().forEach(a=>a.cancel());unf.style.display='none';ubusy=false;ustep=0;
  boatS.on=false;boatS.arr=false;boat.style.visibility='hidden';boat.classList.remove('ready');
  plane.getAnimations().forEach(a=>a.cancel());plane.classList.remove('on');plane.style.transform='translate(-50%,-50%)';
  foldState={L:0,R:0};folds.innerHTML='';paper.style.clipPath='';
  paperWrap.style.visibility='';paperWrap.style.opacity='';paperWrap.style.transform='';
  txt.readOnly=false;txt.value='';txt.style.opacity='';$('count').textContent='0 / 300';$('count').style.display='';send.style.display='';
  setHint('');setTimeout(()=>txt.focus({preventScroll:true}),350);
}

/* ---------- water sound (synthesized, starts after first touch) ---------- */
const snd=$('snd');let actx=null,master=null,soundOn=true,lapT=null;
function noiseBuf(kind,sec){
  const sr=actx.sampleRate,L=Math.floor(sr*sec),N=Math.floor(sr*.5),d=new Float32Array(L+N);let last=0,b0=0,b1=0,b2=0;
  for(let i=0;i<L+N;i++){const w=Math.random()*2-1;
    if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.2}
    else{b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.18}}
  const buf=actx.createBuffer(1,L,sr),o=buf.getChannelData(0);
  for(let i=0;i<L;i++)o[i]=i<N?d[i]*(i/N)+d[L+i]*(1-i/N):d[i];
  return buf;
}
function loop(buf){const s=actx.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s}
function lfo(freq,depth,target,offset){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;g.gain.value=depth;o.connect(g).connect(target);o.start();if(offset!=null)target.value=offset}
let brown,pink;
function buildAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();master.gain.value=0;
  const comp=actx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;
  master.connect(comp).connect(actx.destination);
  brown=noiseBuf('brown',8);pink=noiseBuf('pink',6);
  /* deep flowing body */
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.Q.value=.4;
  const g1=actx.createGain();loop(brown).connect(lp).connect(g1).connect(master);
  lfo(.06,.12,g1.gain,.34);lfo(.043,160,lp.frequency,520);
  /* soft surface shimmer */
  const bp=actx.createBiquadFilter();bp.type='bandpass';bp.Q.value=.5;bp.frequency.value=1600;
  const hs=actx.createBiquadFilter();hs.type='lowpass';hs.frequency.value=4200;
  const g2=actx.createGain();loop(pink).connect(bp).connect(hs).connect(g2).connect(master);
  lfo(.11,.018,g2.gain,.04);lfo(.07,500,bp.frequency,1600);
  scheduleLap();
}
function lap(){
  if(!actx||actx.state!=='running')return;
  const t=actx.currentTime,src=actx.createBufferSource();src.buffer=brown;
  const f=actx.createBiquadFilter();f.type='bandpass';f.Q.value=.8;
  const g=actx.createGain();const pan=actx.createStereoPanner?actx.createStereoPanner():null;
  const f0=260+Math.random()*120,dur=1.6+Math.random()*1.2,peak=.22+Math.random()*.18+(boatS.on?.12:0);
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f0*2.6,t+dur*.35);f.frequency.exponentialRampToValueAtTime(f0*1.1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+dur*.3);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  let node=src.connect(f).connect(g);if(pan){pan.pan.value=Math.random()*1.2-.6;node=node.connect(pan)}node.connect(master);
  src.start(t,Math.random()*5,dur+.1);
}
function scheduleLap(){clearTimeout(lapT);lapT=setTimeout(()=>{lap();scheduleLap()},(boatS.on?900:1700)+Math.random()*(boatS.on?1200:2400))}
function startSound(){
  if(!soundOn)return;
  try{if(!actx)buildAudio();if(actx.state==='suspended')actx.resume();
    master.gain.cancelScheduledValues(actx.currentTime);master.gain.setTargetAtTime(.7,actx.currentTime,1.2)}catch(e){}
}
function stopSound(){if(!actx)return;master.gain.cancelScheduledValues(actx.currentTime);master.gain.setTargetAtTime(0,actx.currentTime,.25)}
scene.addEventListener('pointerdown',e=>{if(e.target.closest('#snd'))return;startSound()},{passive:true});
txt.addEventListener('keydown',startSound,{once:true});
snd.addEventListener('click',()=>{soundOn=!soundOn;snd.setAttribute('aria-pressed',soundOn);snd.setAttribute('aria-label',soundOn?'물소리 끄기':'물소리 켜기');soundOn?startSound():stopSound()});
document.addEventListener('visibilitychange',()=>{if(!actx)return;document.hidden?actx.suspend():(soundOn&&actx.resume())});
})();
</script>
