body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#f6e6ea}
.stage{display:flex;justify-content:center}
.poster{position:relative;width:min(100vw,calc(100dvh * 1352 / 2400));aspect-ratio:1352/2400;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 30px 80px -30px rgba(90,40,60,.45)}
.poster>img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.cherry{position:absolute;padding:0;border:0;background:none;cursor:pointer;left:25.5891%;top:13.6991%;width:10.2811%;transform-origin:12.14% 0;-webkit-tap-highlight-color:transparent}
.cherry img{display:block;width:100%;height:auto;pointer-events:none}
.cherry:focus-visible{outline:2px solid var(--rose);outline-offset:4px;border-radius:40%}
.cherry.idle{animation:sway 2.8s ease-in-out infinite}
.cherry.idle img{animation:shine 4.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
@keyframes shine{
  0%,100%{filter:drop-shadow(0 0 0 rgba(255,236,242,0)) brightness(1)}
  45%{filter:drop-shadow(0 0 14px rgba(255,255,255,.7)) drop-shadow(0 0 34px rgba(255,176,204,.5)) drop-shadow(0 0 64px rgba(255,160,196,.36)) brightness(1.2)}
  85%{filter:drop-shadow(0 0 0 rgba(255,238,244,0)) brightness(1)}}
.cherry.pressed{animation:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform:rotate(0)}

/* lifted lace strip */
.lift{position:fixed;inset:0;z-index:20}

.strip .write{position:absolute;inset:16% 4% 22%;display:flex;align-items:center;opacity:0}
.strip textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;color:#4A1E2E;text-align:center;
  font:inherit;font-family:"LaceLetters","Gowun Dodum",sans-serif;font-size:56px;line-height:1.12;padding:0;overflow:hidden;caret-color:#7A3A52;
  text-shadow:0 0 6px rgba(255,250,252,.95),0 0 14px rgba(255,250,252,.8)}
.strip textarea::placeholder{color:rgba(122,58,82,.55)}
.strip .foot{position:absolute;left:4%;right:3%;bottom:9%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;opacity:0}
.hint{font-family:"Gowun Dodum",sans-serif;font-size:11px;color:#7A3A52;background:rgba(255,250,252,.7);padding:2px 8px;border-radius:999px}
.end{font-family:"Gowun Dodum",sans-serif;font-size:12px;color:#fff;background:#7A3A52;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(74,30,46,.25);white-space:nowrap}
.end:hover{background:#5E2A3F}
.end:focus-visible{outline:2px solid #fff;outline-offset:2px}
.strip-shadow{position:fixed;pointer-events:none;border-radius:6px;box-shadow:0 26px 60px -18px rgba(60,20,36,.55);opacity:0}

/* shared lines */
.together{max-width:720px;margin:0 auto;padding:56px 20px 72px}
.together h2{font-family:"Gowun Dodum",sans-serif;font-weight:400;font-size:17px;margin:0 0 4px;color:var(--ink)}
.together .sub{font-family:"Gowun Dodum",sans-serif;font-size:13px;color:var(--soft);margin:0 0 22px}
.lines{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.lines li{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px dashed var(--line)}
.lines li:first-child{border-top:0}
.lines .t{flex:1;font-size:26px;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.lines .d{font-family:"Gowun Dodum",sans-serif;font-size:11px;color:var(--soft);white-space:nowrap}
.lines .x{font-family:"Gowun Dodum",sans-serif;border:0;background:none;color:var(--soft);cursor:pointer;font-size:12px;padding:4px}
.lines .x:focus-visible{outline:2px solid var(--rose)}
.empty{font-family:"Gowun Dodum",sans-serif;font-size:14px;color:var(--soft);padding:22px 18px;margin:0}
.toast{max-width:calc(100vw - 32px);text-align:center;position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#4A1E2E;color:#fff;font-family:"Gowun Dodum",sans-serif;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  .cherry.idle{animation:none}
  .toast{transition:none}
}
</style>
</head>

const toastEl=document.getElementById('toast');let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),2400)}


function bandRect(){const r=poster.getBoundingClientRect();return{left:r.left,top:r.top+r.height*BAND.top,width:r.width,height:r.height*BAND.height}}
function targetRect(){const vw=innerWidth,vh=innerHeight;const w=Math.min(vw*0.94,980);const h=Math.max(150,Math.min(vh*0.34,w*0.30));return{left:(vw-w)/2,top:(vh-h)/2,width:w,height:h}}
const px=r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
function place(el,r){Object.assign(el.style,px(r))}
let open=false,busy=false;

function fit(){ta.style.paddingTop='0px';let s=Math.min(64,Math.max(26,strip.clientHeight*0.27));ta.style.fontSize=s+'px';
  while(ta.scrollHeight>ta.clientHeight+2&&s>18){s-=2;ta.style.fontSize=s+'px'}
  // keep the line(s) vertically centred on the lace
  ta.style.height='0px';const need=ta.scrollHeight;ta.style.height='';
  ta.style.paddingTop=Math.max(0,(ta.clientHeight-need)/2)+'px'}

async function openStrip(){
  if(open||busy)return;busy=true;open=true;
  lift.hidden=false;const a=bandRect(),b=targetRect();
  place(strip,a);place(shadow,a);
  const d=reduce?1:900,e='cubic-bezier(.2,.8,.2,1)';
  // the lace band first sinks back, then rises above everything and settles in the centre
  const k1=Object.assign(px(a),{transform:'translateY(0) scale(1)',offset:0});
  const k2=Object.assign(px(a),{transform:'translateY(6px) scale(.985)',offset:.18});
  const k3=Object.assign(px(b),{transform:'translateY(0) scale(1)',offset:1});
  const anims=[strip.animate([k1,k2,k3],{duration:d,easing:e,fill:'forwards'}),
    shadow.animate([Object.assign(px(a),{opacity:0}),Object.assign(px(a),{opacity:0,offset:.18}),Object.assign(px(b),{opacity:1})],{duration:d,easing:e,fill:'forwards'}),
    scrim.animate([{opacity:0},{opacity:1}],{duration:d,fill:'forwards'})];
  await Promise.all(anims.map(x=>x.finished));
  place(strip,b);place(shadow,b);anims.forEach(x=>x.cancel());scrim.style.opacity=1;shadow.style.opacity=1;
  write.animate([{opacity:0},{opacity:1}],{duration:reduce?1:260,fill:'forwards'});
  foot.animate([{opacity:0},{opacity:1}],{duration:reduce?1:260,fill:'forwards'});
  write.style.opacity=1;foot.style.opacity=1;
  ta.value='';fit();ta.focus({preventScroll:true});busy=false;
}
async function closeStrip(){
  if(!open||busy)return;busy=true;
  const text=ta.value.replace(/\s+/g,' ').trim();
  const a=bandRect(),b=targetRect();
  write.style.opacity=0;foot.style.opacity=0;
  const d=reduce?1:700,e='cubic-bezier(.6,0,.3,1)';
  const anims=[strip.animate([Object.assign(px(b),{opacity:1}),Object.assign(px(a),{opacity:1,offset:.85}),Object.assign(px(a),{opacity:0})],{duration:d,easing:e,fill:'forwards'}),
    shadow.animate([Object.assign(px(b),{opacity:1}),Object.assign(px(a),{opacity:0})],{duration:d,easing:e,fill:'forwards'}),
    scrim.animate([{opacity:1},{opacity:0}],{duration:d,fill:'forwards'})];
  await Promise.all(anims.map(x=>x.finished));anims.forEach(x=>x.cancel());
  lift.hidden=true;scrim.style.opacity=0;shadow.style.opacity=0;open=false;busy=false;
  cherry.focus({preventScroll:true});
  if(text)save(text);
}
cherry.addEventListener('click',openStrip);
endBtn.addEventListener('click',closeStrip);
scrim.addEventListener('click',closeStrip);
addEventListener('keydown',ev=>{if(ev.key==='Escape'&&open)closeStrip()});
ta.addEventListener('input',fit);
ta.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault()}});
addEventListener('resize',()=>{if(open&&!busy){const b=targetRect();place(strip,b);place(shadow,b);fit()}});

/* ---- shared sentences ---- */
const list=document.getElementById('lines'),sub=document.getElementById('tgsub');
let db=null,me=null,owner=false,docs=[];
function fmt(t){const d=new Date(t);return (d.getMonth()+1)+'.'+d.getDate()}
function render(){
  list.textContent='';
  const items=[];docs.forEach(d=>(d.items||[]).forEach((it,i)=>items.push({id:d.id,i,text:it.text,at:it.at})));
  items.sort((a,b)=>b.at-a.at);
  if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='아직 쓴 문장이 없어요. 체리를 눌러 첫 문장을 남겨 보세요.';list.appendChild(p);return}
  items.slice(0,60).forEach(it=>{
    const li=document.createElement('li');const t=document.createElement('span');t.className='t';t.textContent=it.text;
    const d=document.createElement('span');d.className='d';d.textContent=fmt(it.at);li.append(t,d);
    if(owner||it.id===me){const x=document.createElement('button');x.className='x';x.type='button';x.textContent='지우기';x.setAttribute('aria-label','이 문장 지우기');x.onclick=()=>removeItem(it.id,it.at);li.appendChild(x)}
    list.appendChild(li)});
}
/* 함께 쓴 문장: Netlify 함수(/api/lines)에 저장 */
me=(()=>{try{let v=localStorage.getItem('lace-me');if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));localStorage.setItem('lace-me',v)}return v}catch(e){return null}})();
async function load(){
  try{const r=await fetch('/api/lines',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();docs=j.docs||[];sub.textContent='체리를 눌러 쓴 문장이 여기에 모여요.';render()}
  catch(e){sub.textContent='함께 쓴 문장을 불러오지 못했어요.'}
}
async function save(text){
  if(!me){toast('이 브라우저에서는 문장을 남길 수 없어요');return}
  try{
    const r=await fetch('/api/lines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({me,text:text.slice(0,120)})});
    if(!r.ok)throw r.status;toast('문장을 남겼어요');
    try{const now=Date.now();let d=docs.find(x=>x.id===me);if(!d){d={id:me,items:[],at:now};docs.unshift(d)}d.items=[{text:text.slice(0,120),at:now},...(d.items||[])].slice(0,8);d.at=now;docs.sort((a,b)=>b.at-a.at);render()}catch(_){}
    load();
  }catch(e){toast(e===429?'잠시 후 다시 남겨 주세요':'문장을 남기지 못했어요. 잠시 후 다시 해 보세요')}
}
async function removeItem(id,at){
  try{const r=await fetch('/api/lines',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({me,at})});if(!r.ok)throw 0;load()}
  catch(e){toast('지우지 못했어요')}
}
load();setInterval(()=>{if(!document.hidden)load()},10000);
render();
})();
</script>
